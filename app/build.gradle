plugins { id 'com.android.application' }
def lumiDebugKey = rootProject.file('build/lumi-debug.keystore')
tasks.register('prepareDebugKey', Exec) {
    onlyIf { !lumiDebugKey.exists() }
    doFirst { lumiDebugKey.parentFile.mkdirs() }
    commandLine "${System.getProperty('java.home')}/bin/keytool", '-genkeypair', '-keystore', lumiDebugKey,
            '-storepass', 'android', '-keypass', 'android', '-alias', 'androiddebugkey',
            '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000', '-dname', 'CN=Android Debug,O=Lumi,C=KR'
}
android {
    namespace 'com.junyoung.lumi'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.junyoung.lumi'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug { storeFile lumiDebugKey; storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
}
tasks.configureEach { if (name == 'validateSigningDebug') dependsOn tasks.named('prepareDebugKey') }
