<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>폰파리 실사 시험판</title>
<!-- 실사 시험판: 장면마다 「머무는 영상」(카메라 고정, 사람만 움직임, 반복)과 장면 사이 「이동 영상」(스크롤로 감김)을 이어 붙임 -->
<style>
  :root { --ink: #1c2024; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #cfd8dc; color: var(--ink); font-family: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  .stage { position: fixed; inset: 0; overflow: hidden; background: #cfd8dc; }
  .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
  .stage video.on { opacity: 1; }
  .track { position: relative; height: 500vh; height: 500svh; }
  .title { position: fixed; left: 20px; top: 20px; max-width: min(520px, calc(100vw - 40px)); padding: 16px 20px 18px; border-radius: 20px; background: rgba(255,255,255,.82); transition: opacity .35s, transform .45s; }
  .title.off { opacity: 0; transform: translateY(12px); }
  .title small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .14em; opacity: .6; margin-bottom: 6px; }
  .title h1 { margin: 0; font-size: clamp(26px, 5vw, 52px); line-height: 1.15; letter-spacing: -.03em; font-weight: 900; }
  .meter { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.88); font: 700 12px/1 system-ui, sans-serif; }
  .bar { position: fixed; left: 0; bottom: 0; height: 3px; width: 0; background: #ff6a23; }
  .sets { position: fixed; right: 16px; top: 16px; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.9); box-shadow: 0 6px 18px -10px rgba(0,0,0,.4); z-index: 5; }
  .sets button { border: 0; background: none; font: 800 12px system-ui, sans-serif; padding: 8px 12px; border-radius: 999px; cursor: pointer; color: #555; }
  .sets button[aria-pressed="true"] { background: #1c2024; color: #fff; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #cfd8dc; font-weight: 800; transition: opacity .4s; }
  #loading.done { opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .title { transition: none; } }
</style>
</head>
<body>
<div class="stage" aria-hidden="true">
  <video id="idleA" muted playsinline loop preload="auto"></video>
  <video id="move" muted playsinline preload="auto"></video>
  <video id="idleB" muted playsinline loop preload="auto"></video>
</div>
<!-- 영상 세트 전환: pv = 사이트 3D로 뽑은 프리비즈, v = Higgsfield AI 실사 (주소 ?set=v 로도 고정 가능) -->
<div class="sets" role="group" aria-label="영상 세트"><button data-set="pv">3D 프리비즈</button><button data-set="v">AI 실사</button></div>
<div class="title" id="t0"><small>PHONEPARIS · 에펠탑 광장</small><h1>에펠탑 광장에<br>폰 시장이 열렸다.</h1></div>
<div class="title off" id="t1"><small>PHONEPARIS</small><h1>광장 위로,<br>천천히 내려가 볼까.</h1></div>
<div class="meter" id="meter">스크롤해 보세요 ↓</div>
<i class="bar" id="bar"></i>
<div id="loading">실사 영상 불러오는 중…</div>
<main class="track"></main>
<script>
(function () {
  var A = document.getElementById("idleA"), M = document.getElementById("move"), B = document.getElementById("idleB");
  var meter = document.getElementById("meter"), bar = document.getElementById("bar");
  // 스크롤 구간: 0~0.2 광장에 머묾 / 0.2~0.8 이동(스크롤로 감김) / 0.8~1 하강 장면에 머묾
  var IN = .2, OUT = .8, target = 0, shown = 0, mode = "";
  function prog() { var h = document.documentElement.scrollHeight - innerHeight; return h > 0 ? Math.min(1, Math.max(0, scrollY / h)) : 0; }
  function show(v) { [A, M, B].forEach(function (x) { x.classList.toggle("on", x === v); }); }
  function setMode(m) {
    if (m === mode) return; mode = m;
    if (m === "A") { A.currentTime = 0; A.play().catch(function () {}); show(A); B.pause(); }        // 이동 영상 첫 장면 = 머무는 영상 첫 장면
    else if (m === "B") { B.currentTime = 0; B.play().catch(function () {}); show(B); A.pause(); }   // 이동 영상 끝 장면 = 머무는 영상 첫 장면
    else { A.pause(); B.pause(); show(M); }
    document.getElementById("t0").classList.toggle("off", m !== "A");
    document.getElementById("t1").classList.toggle("off", m !== "B");
  }
  function onScroll() {
    var p = prog(); bar.style.width = (p * 100) + "%";
    if (p <= IN) setMode("A"); else if (p >= OUT) setMode("B"); else setMode("M");
    target = Math.min(1, Math.max(0, (p - IN) / (OUT - IN)));
    meter.textContent = mode === "M" ? "이동 중 " + Math.round(target * 100) + "%" : mode === "A" ? "광장 · 사람들이 움직이는 중" : "하강 · 사람들이 움직이는 중";
  }
  // 이동 영상은 재생하지 않고 스크롤 위치로 프레임만 맞춤 (부드럽게 따라가기, 이전 탐색이 끝난 뒤에만 다음 탐색)
  var seeking = false; M.addEventListener("seeked", function () { seeking = false; });
  (function tick() {
    requestAnimationFrame(tick);
    if (!M.duration) return;
    shown += (target - shown) * .2;
    var t = Math.min(M.duration - .05, shown * M.duration);
    if (!seeking && Math.abs(M.currentTime - t) > 1 / 30) { seeking = true; M.currentTime = t; }
  })();
  addEventListener("scroll", onScroll, { passive: true });
  function useSet(set) {
    A.src = set + "/a-idle.mp4"; M.src = set + "/ab-move.mp4"; B.src = set + "/b-idle.mp4";
    document.querySelectorAll(".sets button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.set === set ? "true" : "false"); });
    mode = ""; onScroll();
  }
  document.querySelectorAll(".sets button").forEach(function (b) { b.onclick = function () { useSet(b.dataset.set); }; });
  useSet(/[?&]set=v\b/.test(location.search) ? "v" : "pv");
  var ready = 0; [A, M, B].forEach(function (v) { v.addEventListener("loadeddata", function () { if (++ready === 3) document.getElementById("loading").classList.add("done"); }, { once: true }); });
  setTimeout(function () { document.getElementById("loading").classList.add("done"); }, 6000);
  onScroll();
})();
</script>
</body>
</html>
