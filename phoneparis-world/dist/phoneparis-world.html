<title>폰파리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="에펠탑 광장에 폰 시장이 열렸다. 여섯 폰팔이를 만나고, 3D로 내 폰을 꾸며 보세요.">
  <meta name="theme-color" content="#cfd8dc">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
/* 폰파리 — 영상과 같은 밝은 하늘·회색 광장 톤 하나로 고정한 단일 테마
   UI v3: 하단 UI(카드·도크·가게 시트)를 한 장짜리 깨끗한 면으로 정리하고, 마우스 반응을 촘촘하게 */
:root {
  --ink: #1c2024;
  --ink2: #3a4148;
  --muted: #6f7880;
  --line: rgba(28, 32, 36, .11);
  --line2: rgba(28, 32, 36, .06);
  --soft: #f1f3f5;
  --soft2: #f8f9fa;
  --paper: #ffffff;
  --blue: #254bf1;
  --orange: #ff6a23;
  --red: #e5333f;
  --green: #0f8a4f;
  --sky: #cfd8dc;
  --sh-1: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 1px rgba(16, 24, 40, .04);
  --sh-2: 0 12px 28px -14px rgba(16, 24, 40, .32), 0 2px 6px -2px rgba(16, 24, 40, .08);
  --sh-3: 0 34px 80px -30px rgba(16, 24, 40, .5), 0 4px 14px -6px rgba(16, 24, 40, .12);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --font: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --brand: "Arial Black", Arial, var(--font);
  --ex: 0; --ey: 0;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-snap-type: y mandatory; }
html, body { margin: 0; }
body { word-break: keep-all; background: var(--sky); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }

/* 스크롤 트랙: 장면 하나 = 화면 하나 */
.track { position: relative; z-index: 1; pointer-events: none; }
.stop { height: 100vh; height: 100svh; scroll-snap-align: start; scroll-snap-stop: always; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

#world, #fallback { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; transition: filter .08s linear; }
#fallback img { width: 100%; height: 100%; object-fit: cover; transition: opacity .4s; }

/* 헤더 */
.top {
  position: fixed; z-index: 20; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 14px max(18px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.brand { background: rgba(255,255,255,.8); backdrop-filter: blur(10px); padding: 4px 12px 5px; border-radius: 999px; font-family: var(--brand); font-weight: 900; font-size: 22px; letter-spacing: -.04em; color: var(--ink); text-decoration: none; transition: transform .3s var(--spring); }
.brand span { color: var(--blue); }
.brand i { display: inline-block; font-style: normal; color: var(--orange); margin-left: 2px; transition: transform .6s var(--spring); }
.top-note { font-size: 13px; color: var(--ink); background: rgba(255,255,255,.6); padding: 4px 10px; border-radius: 999px; }
.top-cta { position: relative; overflow: hidden; margin-left: auto; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; box-shadow: 0 6px 18px -8px rgba(0,0,0,.5); transition: transform .3s var(--spring), box-shadow .3s; }

/* 로더 */
#loader { position: fixed; inset: 0; z-index: 50; background: var(--sky); display: grid; place-content: center; justify-items: center; gap: 10px; transition: opacity .6s var(--ease), visibility .6s; }
#loader b { font-family: var(--brand); font-size: 40px; letter-spacing: -.05em; }
#loader b span { color: var(--blue); }
#loader small { color: var(--muted); }
#loader i { width: 120px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--orange) 40%, transparent 0) 0 0 / 200% 100%; animation: load 1s linear infinite; }
@keyframes load { to { background-position: -200% 0; } }
body.ready #loader { opacity: 0; visibility: hidden; }

/* 장면 제목 */
.headline {
  position: fixed; z-index: 5; left: max(20px, env(safe-area-inset-left, 0px)); top: 92px; max-width: min(560px, 86vw);
  pointer-events: none; transition: opacity .35s var(--ease), transform .5s var(--ease);
  background: rgba(255,255,255,.66); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 16px 20px 18px; border-radius: 22px; border: 1px solid rgba(255,255,255,.6);
}
.headline.off { opacity: 0; transform: translateY(14px); }
.eyebrow { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--ink); opacity: .65; }
.headline h1 { margin: 0; font-size: clamp(30px, 5.4vw, 64px); line-height: 1.12; font-weight: 900; letter-spacing: -.035em; text-wrap: balance; color: var(--ink); }
.headline .sub { margin: 12px 0 0; font-size: 15px; color: var(--ink); opacity: .75; }

/* ───────── 폰팔이 아바타: CSS로 그린 몸 + 마우스를 따라보는 눈 ───────── */
.ava { --s: 46px; position: relative; flex: none; display: inline-grid; place-items: center; width: calc(var(--s) * .7); height: var(--s); background: var(--c, #ccc); border-radius: 999px; box-shadow: inset -4px -6px 0 rgba(0,0,0,.08), inset 3px 4px 0 rgba(255,255,255,.25); vertical-align: middle; }
.ava.sm { --s: 26px; } .ava.xs { --s: 20px; }
.ava .eye { position: absolute; top: 22%; width: calc(var(--s) * .24); height: calc(var(--s) * .24); border-radius: 50%; background: #fff; box-shadow: 0 1px 1px rgba(0,0,0,.15); display: grid; place-items: center; animation: avaBlink 4.6s infinite; }
.ava .eye:first-child { left: 16%; } .ava .eye:last-child { right: 16%; }
.ava .eye i { width: 52%; height: 52%; border-radius: 50%; background: #111; transform: translate(calc(var(--ex) * 28%), calc(var(--ey) * 28%)); transition: transform .12s linear; }
@keyframes avaBlink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.ava[data-d="designer"] { border-radius: 999px 999px 40% 40% / 40% 40% 10% 10%; }
.ava[data-d="quick"] { width: calc(var(--s) * .78); height: calc(var(--s) * .92); border-radius: 18%; }
.ava[data-d="price"] { width: calc(var(--s) * .82); border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); box-shadow: none; }
.ava[data-d="price"] .eye { top: 50%; width: calc(var(--s) * .2); height: calc(var(--s) * .2); }
.ava[data-d="price"] .eye:first-child { left: 26%; } .ava[data-d="price"] .eye:last-child { right: 26%; }
.ava[data-d="safe"] { width: calc(var(--s) * 1.02); height: calc(var(--s) * .86); border-radius: 22%; }
.ava[data-d="used"] { width: calc(var(--s) * .44); border-radius: 18%; }
.ava[data-d="used"] .eye { width: calc(var(--s) * .17); height: calc(var(--s) * .17); }
.ava[data-d="used"] .eye:first-child { left: 8%; } .ava[data-d="used"] .eye:last-child { right: 8%; }
.ava[data-d="allinone"] { width: calc(var(--s) * .82); border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%; }
.ava[data-d="allinone"] .eye { top: 32%; }

/* ───────── 호객 말풍선 (캐릭터 머리 위) ───────── */
.bubble {
  position: fixed; z-index: 6; left: 0; top: 0; max-width: 286px; padding: 10px 14px 11px; border-radius: 18px;
  background: #fff; color: var(--ink); border: 1.5px solid color-mix(in srgb, var(--c, #999) 40%, #fff);
  box-shadow: var(--sh-2); pointer-events: none; transition: opacity .3s; text-align: left; font-size: 14px; line-height: 1.42; font-weight: 600;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 14px; height: 14px; margin-left: -7px; background: #fff; border-right: 1.5px solid color-mix(in srgb, var(--c, #999) 40%, #fff); border-bottom: 1.5px solid color-mix(in srgb, var(--c, #999) 40%, #fff); transform: rotate(45deg); border-radius: 0 0 4px 0; }
.bubble b { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 11.5px; font-weight: 800; color: var(--dk, var(--ink)); letter-spacing: .02em; }
.bubble #bubbleText { display: block; }
.bubble.swap #bubbleText { animation: bubIn .45s var(--spring); }
@keyframes bubIn { from { opacity: 0; transform: translateY(6px) scale(.96); } }
.emote { position: absolute; right: -12px; top: -16px; min-width: 32px; height: 32px; padding: 0 7px; border-radius: 999px; background: var(--dk, var(--ink)); color: #fff; font-weight: 900; font-size: 15px; display: grid; place-items: center; box-shadow: 0 6px 14px -6px rgba(0,0,0,.5); transform: scale(0); }
.emote.pop { animation: emotePop 1.2s var(--spring); }
@keyframes emotePop { 0% { transform: scale(0) rotate(-20deg); } 18% { transform: scale(1.25) rotate(8deg); } 30%, 78% { transform: scale(1) rotate(0); } 100% { transform: translateY(-8px) scale(0); } }
/* 폰팔이별 말풍선 성격 */
.bubble[data-d="designer"] { border-image: none; background: linear-gradient(#fff, #fff) padding-box, linear-gradient(120deg, #b7a6dc, #f2b6d4, #b7e0f2) border-box; border: 2px solid transparent; }
.bubble[data-d="designer"].swap #bubbleText { animation: bubSpark .55s var(--spring); }
@keyframes bubSpark { 0% { opacity: 0; transform: scale(.8) rotate(-3deg); } 60% { transform: scale(1.04) rotate(1deg); } }
.bubble[data-d="quick"] { transform-origin: 50% 100%; }
.bubble[data-d="quick"].swap { animation: bubShake .45s; }
.bubble[data-d="quick"].swap #bubbleText { animation: bubDash .3s var(--ease); }
@keyframes bubShake { 20% { margin-left: -4px; } 40% { margin-left: 4px; } 60% { margin-left: -2px; } 80% { margin-left: 2px; } }
@keyframes bubDash { from { opacity: 0; transform: translateX(-18px) skewX(-12deg); } }
.bubble[data-d="price"] { border-style: dashed; font-size: 13px; color: var(--ink2); }
.bubble[data-d="price"].swap #bubbleText { animation: bubWhisper .7s var(--ease); }
@keyframes bubWhisper { from { opacity: 0; filter: blur(4px); letter-spacing: .08em; } }
.bubble[data-d="safe"] { border-radius: 14px; }
.bubble[data-d="safe"].swap #bubbleText { animation: bubCalm .8s var(--ease); }
@keyframes bubCalm { from { opacity: 0; transform: translateY(10px); } }
.bubble[data-d="used"].swap #bubbleText { animation: bubStamp .4s var(--spring); }
@keyframes bubStamp { from { opacity: 0; transform: scale(1.25) rotate(-4deg); } }
.bubble[data-d="allinone"] { border-radius: 24px; }
.bubble[data-d="allinone"].swap #bubbleText { animation: bubLazy .9s var(--ease); }
@keyframes bubLazy { 0% { opacity: 0; transform: rotate(-3deg) translateY(4px); } 50% { transform: rotate(1.5deg); } }

/* ───────── 폰팔이 카드 (투어) ───────── */
.card {
  position: fixed; z-index: 8; right: max(28px, env(safe-area-inset-right, 0px)); top: 50%; width: 384px; max-height: calc(100vh - 150px);
  padding: 20px 18px 16px; border-radius: 28px; overflow: hidden;
  background: rgba(255,255,255,.95); backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2);
  border: 1px solid rgba(255,255,255,.75); box-shadow: var(--sh-3);
  transform: translate(44px, -50%) perspective(1000px); opacity: 0; visibility: hidden;
  transition: transform .6s var(--ease), opacity .35s, visibility .35s;
}
.card.on { transform: translate(0, -50%) perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); opacity: 1; visibility: visible; }
.card.on:hover { transition: transform .15s linear, opacity .35s, visibility .35s; }
.card::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s; background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 0%), color-mix(in srgb, var(--c) 20%, transparent), transparent 60%); }
.card:hover::before { opacity: 1; }
.card::after { content: ""; position: absolute; left: 22px; right: 22px; top: 0; height: 4px; border-radius: 0 0 4px 4px; background: var(--c); }
.card > * { position: relative; }
.card-h { display: flex; align-items: center; gap: 12px; }
.card-h .who { display: grid; gap: 1px; min-width: 0; }
.badge { display: inline-block; font-weight: 900; font-size: 15.5px; letter-spacing: -.02em; color: var(--ink); }
.role { color: var(--muted); font-size: 12px; font-weight: 600; }
.live { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 16%, #fff); color: var(--dk, var(--ink)); font-size: 11px; font-weight: 800; white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--dk, var(--ink)); animation: live 1.4s infinite; }
@keyframes live { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 70%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
.card h2 { margin: 14px 0 12px; font-size: 22px; line-height: 1.28; letter-spacing: -.035em; font-weight: 900; text-wrap: balance; }
.points { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; }
.points li { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 14px; background: var(--soft2); border: 1px solid var(--line2); font-weight: 700; font-size: 14px; transition: transform .3s var(--spring), background .25s, border-color .25s; }
.points li i { flex: none; font-style: normal; width: 24px; height: 24px; border-radius: 8px; background: color-mix(in srgb, var(--c) 22%, #fff); color: var(--dk, var(--ink)); display: grid; place-items: center; font-size: 12px; font-weight: 900; transition: transform .4s var(--spring), background .25s, color .25s; }
.card.on .points li { animation: liIn .5s var(--spring) backwards; animation-delay: calc(.12s + var(--k, 0) * 70ms); }
@keyframes liIn { from { opacity: 0; transform: translateX(16px); } }
.card .ava { transition: transform .4s var(--spring); }

/* 기본 버튼 */
.primary, .ghost { position: relative; overflow: hidden; min-height: 50px; padding: 0 20px; border-radius: 14px; font-weight: 800; font-size: 15px; transition: transform .25s var(--spring), box-shadow .25s, filter .2s, background .2s; }
.primary { background: var(--ink); color: #fff; width: 100%; }
.ghost { background: var(--soft); }
.link { color: var(--blue); font-weight: 700; font-size: 14px; padding: 6px 0; }
.card .primary { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; border-radius: 16px; background: linear-gradient(135deg, var(--dk, var(--ink)), color-mix(in srgb, var(--dk, var(--ink)) 70%, var(--c))); box-shadow: 0 14px 28px -14px var(--dk, var(--ink)); transform: translate(var(--tx, 0px), var(--ty, 0px)); }
.arr { font-style: normal; display: inline-block; transition: transform .35s var(--spring); }
.primary::after, .say.go::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent); transform: skewX(-18deg); transition: left .7s var(--ease); pointer-events: none; }

/* 물결 (누르면) */
.rip { position: absolute; border-radius: 50%; background: currentColor; opacity: .2; transform: scale(0); animation: rip .6s var(--ease) forwards; pointer-events: none; }
@keyframes rip { to { transform: scale(1); opacity: 0; } }

/* ───────── 장면 도크 (하단 가운데) ───────── */
.chapters {
  position: fixed; z-index: 9; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 2px; padding: 5px;
  border-radius: 999px; background: rgba(255,255,255,.74); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border: 1px solid rgba(255,255,255,.75); box-shadow: var(--sh-2); max-width: calc(100vw - 40px);
}
.chapters .ind { position: absolute; left: 0; top: 5px; bottom: 5px; width: 0; border-radius: 999px; background: var(--ink); box-shadow: 0 8px 18px -8px var(--c, #000); transition: transform .5s var(--spring), width .5s var(--spring); }
.chapters button { position: relative; overflow: hidden; z-index: 1; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--ink2); white-space: nowrap; transition: color .25s, transform .3s var(--spring); }
.chapters button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink)); transition: transform .35s var(--spring), box-shadow .25s; }
.chapters button[aria-current="true"] { color: #fff; }
.chapters button[aria-current="true"] i { box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
.progress { position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.4); }
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--orange), #ffb27d); }
.scroll-hint { position: fixed; z-index: 9; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.85); backdrop-filter: blur(10px); padding: 8px 14px 8px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; box-shadow: var(--sh-1); transition: opacity .3s, transform .3s var(--spring); }
.scroll-hint::before { content: ""; width: 14px; height: 20px; border-radius: 8px; border: 2px solid var(--ink); background: radial-gradient(circle at 50% 30%, var(--ink) 1.6px, transparent 2.2px) 0 0 / 100% 100% no-repeat; animation: wheel 1.4s var(--ease) infinite; }
@keyframes wheel { 50% { background-position: 0 5px; } }
.scroll-hint span { display: inline-block; animation: nudge 1.4s var(--ease) infinite; }
@keyframes nudge { 50% { transform: translateY(3px); } }
.scroll-hint.off { opacity: 0; pointer-events: none; }

/* ───────── 커서 링 + 이름표 ───────── */
#cursor { position: fixed; left: 0; top: 0; z-index: 80; pointer-events: none; display: none; }
.has-cursor #cursor { display: block; }
#cursor .ring { position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid rgba(28,32,36,.5); opacity: 0; transition: width .35s var(--spring), height .35s var(--spring), left .35s var(--spring), top .35s var(--spring), background .25s, border-color .25s, opacity .2s, border-radius .3s; }
#cursor.on .ring { opacity: 1; }
#cursor.link .ring { width: 46px; height: 46px; left: -23px; top: -23px; background: rgba(28,32,36,.05); border-color: rgba(28,32,36,.22); }
#cursor.text .ring { width: 4px; height: 26px; left: -2px; top: -13px; border-radius: 2px; background: var(--ink); }
#cursor.dealer .ring { width: 62px; height: 62px; left: -31px; top: -31px; background: color-mix(in srgb, var(--c) 28%, transparent); border-color: var(--c); }
#cursorLabel { position: absolute; left: 26px; top: 16px; white-space: nowrap; background: var(--ink); color: #fff; font-size: 12px; font-weight: 800; padding: 7px 11px; border-radius: 999px; box-shadow: var(--sh-2); opacity: 0; transform: translateY(6px) scale(.9); transition: opacity .2s, transform .3s var(--spring); }
#cursorLabel::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--c); vertical-align: 1px; }
#cursor.dealer #cursorLabel { opacity: 1; transform: none; }

/* 시트 */
dialog { border: 0; padding: 0; color: var(--ink); background: transparent; }
dialog::backdrop { background: rgba(14, 20, 28, .45); backdrop-filter: blur(3px); }
.sheet { width: min(460px, calc(100% - 24px)); max-height: calc(100vh - 40px); }
.sheet-in { position: relative; background: #fff; border-radius: 24px; padding: 22px; max-height: calc(100vh - 40px); overflow-y: auto; }
.sheet[open] .sheet-in { animation: rise .4s var(--ease); }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.x { position: absolute; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 50%; background: var(--soft); }
.btns { display: flex; gap: 8px; width: 100%; margin-top: 12px; }
.btns > * { flex: 1; }
.sum-rows { display: grid; gap: 6px; margin: 14px 0; }
.sum-rows div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; background: var(--soft); border-radius: 12px; font-size: 14px; }
.sum-rows span { color: var(--muted); }
.center { text-align: center; }
.shot-img { width: 100%; border-radius: 16px; background: var(--soft); }
.note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }

/* 3D 작업실 */
.studio { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; background: #edf2f4; }
.studio[open] { display: block; animation: fade .35s var(--ease); }
@keyframes fade { from { opacity: 0; } }
.studio-grid { display: grid; grid-template-columns: 1fr 440px; height: 100%; }
.stage3d { position: relative; background: radial-gradient(circle at 50% 40%, #ffffff, #dfe7ec 70%); display: flex; flex-direction: column; min-height: 0; }
.stage-top, .stage-bottom { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; gap: 10px; }
.stage-top { padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
.pill { background: var(--c); color: #fff; padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; }
.ed { font-family: var(--brand); font-size: 12px; letter-spacing: .1em; color: var(--muted); }
#studioCanvas { flex: 1; min-height: 0; cursor: grab; }
#studioCanvas:active { cursor: grabbing; }
#studioCanvas canvas { display: block; width: 100%; height: 100%; }
.stage-bottom span { color: var(--muted); font-size: 13px; }
.seg { display: flex; background: #fff; border-radius: 999px; padding: 3px; }
.seg button { padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; transition: background .2s; }
.seg button:hover { background: var(--soft); }
.panel { background: #fff; display: flex; flex-direction: column; min-height: 0; padding: calc(18px + env(safe-area-inset-top, 0px)) 22px calc(18px + env(safe-area-inset-bottom, 0px)); }
.panel-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--brand); font-size: 12px; letter-spacing: .1em; color: var(--muted); }
.steps { display: flex; gap: 6px; margin: 16px 0; overflow-x: auto; scrollbar-width: none; }
.steps button { padding: 8px 12px; border-radius: 999px; background: var(--soft); font-weight: 700; font-size: 13px; white-space: nowrap; }
.steps button[aria-current="step"] { background: var(--ink); color: #fff; }
.steps button:disabled { opacity: .4; }
.panel-body { flex: 1; overflow-y: auto; min-height: 0; }
.panel-body h3 { margin: 4px 0 14px; font-size: 24px; letter-spacing: -.03em; font-weight: 900; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { border: 2px solid var(--line); border-radius: 16px; padding: 14px; text-align: left; display: grid; gap: 4px; background: #fff; transition: transform .25s var(--spring), border-color .2s; }
.opt.on { border-color: var(--ink); }
.opt .sw { width: 28px; height: 28px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.opt small { color: var(--muted); }
.swatches { display: flex; gap: 10px; margin-top: 14px; align-items: center; padding: 6px; }
.swatches button { width: 34px; height: 34px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.swatches button.on { outline: 3px solid var(--ink); outline-offset: 2px; }
.panel-foot { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.sum { display: flex; justify-content: space-between; align-items: baseline; }
.sum span { color: var(--muted); font-size: 13px; }
.sum b { font-size: 22px; }
.panel-foot .btns { margin: 0; }
.panel-foot .primary { width: auto; }

.toast { position: fixed; z-index: 60; left: 50%; top: calc(80px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -10px) scale(.96); opacity: 0; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; box-shadow: var(--sh-2); pointer-events: none; transition: opacity .25s, transform .35s var(--spring); }
.toast.on { opacity: 1; transform: translate(-50%, 0) scale(1); }

/* ═════════ 폰팔이 가게: 미션 스테퍼 + 한 장짜리 시트(대사 → 테이블 → 선택) ═════════ */
html.shopping { overflow: hidden; scroll-snap-type: none; }
html.shopping .card, html.shopping .bubble, html.shopping .headline, html.shopping .chapters, html.shopping .scroll-hint, html.shopping .progress, html.shopping .top-note { display: none !important; }
.shop { position: fixed; inset: 0; z-index: 30; pointer-events: none; --navy: #1E2A5A; --gold: #FFC83D; }
.shop > * { pointer-events: auto; }
.shop-top { position: absolute; left: 0; right: 0; top: calc(70px + env(safe-area-inset-top, 0px)); display: flex; gap: 10px; align-items: center; justify-content: center; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.sbtn { position: relative; overflow: hidden; flex: none; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.8); box-shadow: var(--sh-2); font-size: 16px; font-weight: 800; transition: transform .3s var(--spring), background .2s; }
.mission { position: relative; flex: 1; list-style: none; margin: 0; padding: 9px 12px 7px; display: flex; gap: 0; max-width: 560px; min-width: 0; background: rgba(255,255,255,.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.8); border-radius: 20px; box-shadow: var(--sh-2); }
.mission li { position: relative; flex: 1; display: grid; justify-items: center; gap: 3px; min-width: 0; }
.mission li::before { content: ""; position: absolute; top: 13px; right: 50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
.mission li:first-child::before { display: none; }
.mission li.on::before, .mission li.now::before { background: linear-gradient(90deg, var(--dk), var(--c)); }
.mission li i { position: relative; z-index: 1; font-style: normal; font-size: 13px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #fff; border: 1.5px solid var(--line); filter: grayscale(1); opacity: .55; transition: transform .4s var(--spring), background .3s, border-color .3s, opacity .3s; }
.mission li span { font-size: 10.5px; font-weight: 700; color: var(--muted); white-space: nowrap; transition: color .3s; }
.mission li.on i { filter: none; opacity: 1; background: color-mix(in srgb, var(--c) 22%, #fff); border-color: transparent; color: transparent; }
.mission li.on i::after { content: "✓"; position: absolute; color: var(--dk); font-weight: 900; font-size: 13px; animation: popIn .35s var(--spring); }
.mission li.now i { filter: none; opacity: 1; background: var(--dk); border-color: var(--dk); transform: scale(1.12); animation: nowRing 1.8s infinite; }
.mission li.now span { color: var(--ink); font-weight: 900; }
.mission li.on span { color: var(--ink2); }
@keyframes nowRing { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 65%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
@keyframes popIn { from { transform: scale(0); } }

.shop-low { position: absolute; right: max(22px, env(safe-area-inset-right, 0px)); top: calc(136px + env(safe-area-inset-top, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 444px; display: flex; flex-direction: column; justify-content: flex-end; }
.sb { display: flex; flex-direction: column; max-height: 100%; min-height: 0; background: #fff; border-radius: 26px; box-shadow: var(--sh-3); border: 1px solid rgba(255,255,255,.8); overflow: hidden; animation: sbIn .5s var(--spring); }
@keyframes sbIn { from { transform: translateY(24px) scale(.98); opacity: 0; } }
/* 대사 */
.dlg { position: relative; flex: none; padding: 15px 18px 14px; cursor: pointer; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 14%, #fff), #fff 92%); border-bottom: 1px solid var(--line2); }
.dlg::after { content: attr(data-emote); position: absolute; right: 16px; top: 4px; font-size: 46px; font-weight: 900; line-height: 1; color: var(--c); opacity: .22; pointer-events: none; transform: rotate(10deg); transition: transform .4s var(--spring); }
.dlg.typing::after { animation: emBob .5s ease-in-out infinite alternate; }
@keyframes emBob { to { transform: rotate(-4deg) translateY(-3px) scale(1.08); } }
.dlg .who { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; font-weight: 900; color: var(--dk); letter-spacing: .01em; }
.dlg p { position: relative; margin: 0; font-size: 16px; line-height: 1.55; font-weight: 600; min-height: 1.55em; padding-right: 30px; }
.dlg p b { color: var(--dk); background: linear-gradient(transparent 62%, color-mix(in srgb, var(--c) 38%, transparent) 0); }
.dlg.typing p::after { content: ""; display: inline-block; width: 2px; height: 1.05em; margin-left: 2px; vertical-align: -2px; background: var(--dk); animation: caret .8s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.shop[data-dealer="quick"] .dlg.typing { animation: jit .14s steps(2) infinite; }
@keyframes jit { 50% { transform: translateX(.6px); } }
.shop[data-dealer="price"] .dlg p { font-size: 15px; color: var(--ink2); }
.shop[data-dealer="safe"] .dlg p { letter-spacing: .005em; }
/* 테이블(내용) */
.table { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 10px; color: var(--ink); scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.table.enter > * { animation: fadeUp .45s var(--ease) backwards; }
.table.enter > *:nth-child(2) { animation-delay: .05s; } .table.enter > *:nth-child(3) { animation-delay: .1s; } .table.enter > *:nth-child(4) { animation-delay: .15s; } .table.enter > *:nth-child(n+5) { animation-delay: .2s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
.tl { display: flex; justify-content: space-between; gap: 8px; margin: 4px 2px 8px; font-size: 11.5px; font-weight: 800; letter-spacing: .04em; color: var(--muted); }
.tl small { font-weight: 600; letter-spacing: 0; }
.tl.dark { color: var(--ink); }
/* 선택(말풍선 버튼) */
.sch { flex: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line2); background: #fff; }
.sch:empty { display: none; }
.sch.grid { display: grid; grid-template-columns: repeat(3, 1fr); }
.say { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 14px; font-weight: 800; font-size: 14.5px; color: var(--ink); background: var(--soft); border: 1px solid var(--line2); transform: translate(var(--tx, 0px), var(--ty, 0px)); transition: transform .3s var(--spring), background .2s, box-shadow .3s, border-color .2s; animation: sayIn .45s var(--spring) backwards; animation-delay: calc(var(--i, 0) * 60ms + 40ms); }
.say.go { flex: 1 1 auto; color: #fff; background: var(--dk); border-color: transparent; box-shadow: 0 12px 24px -14px var(--dk); }
.sch.grid .say { padding: 0 6px; }
@keyframes sayIn { from { opacity: 0; transform: translateY(12px) scale(.96); } }
.say:active, .primary:active, .ghost:active, .tok:active, .veh button:active, .pk:active, .coin:active, .way:active { transform: scale(.97); }

/* 진열: 제조사 → 카테고리 → 실제 사진 카드 */
.brands { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 4px; margin-bottom: 10px; background: var(--soft); border-radius: 14px; }
.brands button { position: relative; overflow: hidden; padding: 9px; border-radius: 10px; font-weight: 800; font-size: 14px; color: var(--muted); transition: color .2s, background .25s, box-shadow .25s; }
.brands button.on { background: #fff; color: var(--ink); box-shadow: var(--sh-1); }
.ctabs { display: flex; gap: 18px; margin: 0 2px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.ctabs::-webkit-scrollbar { display: none; }
.ctabs button { position: relative; overflow: hidden; flex: none; padding: 7px 1px 10px; font-weight: 800; font-size: 13px; color: var(--muted); transition: color .2s; }
.ctabs button::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.5px; border-radius: 2px; background: var(--dk); transform: scaleX(0); transition: transform .35s var(--spring); }
.ctabs button.on { color: var(--ink); }
.ctabs button.on::after { transform: scaleX(1); }
.shelf { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; margin: 0 -2px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.shelf::-webkit-scrollbar { display: none; }
.pk { position: relative; overflow: hidden; flex: none; width: 122px; scroll-snap-align: start; display: grid; gap: 7px; padding: 7px 7px 10px; border-radius: 18px; background: #fff; border: 1px solid var(--line); text-align: left; transition: transform .35s var(--spring), box-shadow .3s, border-color .25s; }
.pk::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; background: radial-gradient(140px circle at var(--mx, 50%) var(--my, 30%), color-mix(in srgb, var(--c) 26%, transparent), transparent 62%); }
.pk .im { position: relative; height: 106px; border-radius: 13px; background: radial-gradient(ellipse at 50% 96%, rgba(0,0,0,.12), transparent 55%), var(--soft2); display: grid; place-items: center; }
.pk .im img { max-width: 82px; max-height: 96px; object-fit: contain; filter: drop-shadow(0 8px 10px rgba(0,0,0,.18)); transition: transform .5s var(--spring); }
.pk .tag { position: relative; display: grid; gap: 1px; padding: 0 3px; }
.pk .tag b { font-size: 12px; font-weight: 800; line-height: 1.25; }
.pk .tag s { font-size: 10.5px; color: var(--muted); }
.pk .tag span { font-size: 15px; font-weight: 900; letter-spacing: -.02em; }
.pk .tag em { justify-self: start; margin-top: 3px; font-style: normal; font-size: 10.5px; font-weight: 800; color: var(--green); background: #e7f6ed; border-radius: 6px; padding: 1px 6px; }
.pk .tag em.ub { color: var(--dk); background: color-mix(in srgb, var(--c) 18%, #fff); }
/* 실측 3D 폰 */
.pv3d { position: relative; height: 232px; margin: 0 0 10px; border-radius: 20px; background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 26%, #fff), transparent 72%), linear-gradient(180deg, var(--soft2), #fff); display: grid; place-items: center; overflow: hidden; }
.pv3d .pvimg { max-height: 200px; max-width: 70%; object-fit: contain; filter: drop-shadow(0 14px 16px rgba(0,0,0,.25)); }
.pv3d.live .pvimg { display: none; }
.pv { position: absolute; inset: 0; }
.pv canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.pv canvas:active { cursor: grabbing; }
.pvbar { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; pointer-events: none; }
.pvtip { background: rgba(28,32,36,.72); color: #fff; border-radius: 999px; padding: 5px 11px; font-size: 11px; font-weight: 800; backdrop-filter: blur(6px); }
.pv .pvfold { display: none !important; }
.foldseg { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 4px; margin-bottom: 10px; background: var(--soft); border-radius: 14px; }
.foldseg button { position: relative; overflow: hidden; padding: 9px; border-radius: 10px; font-weight: 800; font-size: 13px; color: var(--muted); transition: background .25s, color .2s, box-shadow .25s; }
.foldseg button.on { background: #fff; color: var(--ink); box-shadow: var(--sh-1); }
.pick-row { display: flex; gap: 12px; align-items: center; padding: 8px 12px; margin-bottom: 12px; border-radius: 14px; background: var(--soft2); border: 1px solid var(--line2); }
.pick-row img { width: 46px; height: 54px; object-fit: contain; }
.pick-row b { display: block; font-size: 14px; } .pick-row em { font-style: normal; font-size: 11.5px; color: var(--muted); }
.chips2 { display: flex; gap: 12px; margin: 2px 4px 14px; flex-wrap: wrap; }
.chips2 button { width: 32px; height: 32px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.12) inset, 0 2px 6px -2px rgba(0,0,0,.25); transition: transform .3s var(--spring), box-shadow .25s; }
.chips2 button.on { box-shadow: 0 0 0 2.5px #fff, 0 0 0 4.5px var(--dk); transform: scale(1.08); }
/* 용량 상자: 올리면 뚜껑이 살짝 열림 */
.boxes { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.pbox { width: 98px; perspective: 420px; transition: transform .35s var(--spring); }
.pbox .lid { display: block; height: 14px; margin: 0 3px; background: #fff; border: 1px solid var(--line); border-bottom: 0; border-radius: 9px 9px 0 0; transform-origin: 50% 100%; transition: transform .45s var(--spring), border-color .2s; }
.pbox .bd { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 72px; background: linear-gradient(180deg, #fff, var(--soft2)); border: 1px solid var(--line); border-radius: 4px 4px 14px 14px; box-shadow: var(--sh-1); transition: box-shadow .25s, border-color .2s; }
.pbox b { font-size: 16px; font-weight: 900; color: var(--ink); transition: color .2s; } .pbox .bd span { font-weight: 800; font-size: 11px; color: var(--muted); }
.pbox.on .bd { border-color: var(--dk); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent), var(--sh-2); }
.pbox.on .lid { transform: rotateX(-58deg) translateY(-3px); border-color: var(--dk); }
.pbox.on b { color: var(--dk); }
/* 지원금 상자 */
.sup { margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: linear-gradient(180deg, #effaf3, #fff); border: 1px solid #d4efdf; }
.sup .tl { color: #11734a; }
.src { font-style: normal; font-size: 10px; font-weight: 700; color: #1d4ed8; background: #e9efff; border-radius: 6px; padding: 1px 6px; margin-left: 3px; white-space: nowrap; }
/* 셀링포인트 선택 타일 */
.opts3 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.veh { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.veh.four { grid-template-columns: repeat(4, 1fr); }
.tok, .veh button { position: relative; overflow: hidden; display: grid; justify-items: center; gap: 3px; text-align: center; background: #fff; border: 1.5px solid var(--line); border-radius: 15px; transition: transform .3s var(--spring), border-color .2s, box-shadow .3s, background .2s; }
.tok { padding: 10px 6px; }
.veh button { padding: 11px 4px 10px; }
.tok::before, .veh button::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; background: radial-gradient(120px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--c) 22%, transparent), transparent 65%); }
.tok i { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); transition: transform .4s var(--spring); }
.tok i.none { background: repeating-linear-gradient(45deg, #ddd 0 3px, #fff 3px 6px); }
.tok b { font-size: 12.5px; } .tok small { font-size: 10.5px; color: var(--muted); }
.veh i { font-style: normal; font-size: 22px; line-height: 1.2; font-weight: 900; transition: transform .4s var(--spring); }
.veh b { font-size: 13px; } .veh span { font-size: 10.5px; color: var(--muted); }
.tok.on, .veh button.on { border-color: var(--dk); background: color-mix(in srgb, var(--c) 10%, #fff); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
.tok.on::after, .veh button.on::after { content: "✓"; position: absolute; top: 6px; right: 7px; width: 17px; height: 17px; border-radius: 50%; background: var(--dk); color: #fff; font-size: 10px; font-weight: 900; display: grid; place-items: center; animation: popIn .35s var(--spring); }
.wide { position: relative; overflow: hidden; width: 100%; min-height: 46px; padding: 11px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 800; transition: transform .3s var(--spring), box-shadow .3s; }
.memo { margin-top: 8px; padding: 9px 11px; border-radius: 12px; background: #fff8dc; color: #6b5300; border: 1px solid #f2e3a6; font-weight: 700; font-size: 12.5px; }
.paper { background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 6px 12px; margin-bottom: 10px; }
.cl { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border-bottom: 1px dashed var(--line); padding: 10px 2px; }
.cl:last-of-type { border-bottom: 0; }
.cl .st { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 2px dashed rgba(28,32,36,.2); display: grid; place-items: center; font-size: 10px; font-weight: 900; color: var(--muted); transition: transform .35s var(--spring), border-color .2s; }
.cl.on .st { border: 2.5px solid var(--red); color: var(--red); transform: rotate(-12deg); animation: stamp .35s cubic-bezier(.3, 1.6, .5, 1); }
.cl.err .st { border-color: var(--red); animation: shake .4s; }
.cl span:last-child { font-size: 13.5px; line-height: 1.4; } .cl b { font-weight: 700; } .cl em { display: block; font-style: normal; font-size: 11.5px; color: var(--muted); }
@keyframes stamp { from { transform: rotate(-12deg) scale(2); opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.ck { font-size: 13px; padding: 5px 0; color: var(--green); font-weight: 700; }
.loading { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 30px 0; color: var(--muted); font-weight: 700; font-size: 13px; }
.loading span { width: 100%; text-align: center; }
.loading i { width: 10px; height: 10px; border-radius: 50%; background: var(--dk); animation: dot 1s infinite; }
.loading i:nth-child(2) { animation-delay: .15s; } .loading i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-8px); opacity: .4; } }
/* 견적 줄 */
.ways { display: grid; gap: 7px; }
.way { position: relative; display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; text-align: left; background: #fff; border: 1.5px solid var(--line); border-radius: 15px; transition: transform .3s var(--spring), border-color .2s, box-shadow .3s, background .2s; }
.way::before { content: ""; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--dk); transform: scaleY(0); transition: transform .35s var(--spring); }

.way .best { position: absolute; right: 10px; top: -9px; font-style: normal; font-size: 10px; font-weight: 900; color: #fff; background: var(--red); border-radius: 6px; padding: 2px 7px; box-shadow: 0 4px 10px -4px var(--red); animation: bestBob 2.4s var(--ease) infinite; }

/* 할인 카드 · 할부 동전 */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.dcard { position: relative; text-align: left; border-radius: 18px; padding: 13px 12px 11px; display: flex; flex-direction: column; gap: 2px; min-height: 132px; color: #fff; cursor: pointer; box-shadow: 0 12px 24px -14px rgba(0,0,0,.55); transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s var(--ease), box-shadow .3s; }
.dcard::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .25s; background: radial-gradient(180px circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.38), transparent 60%); }
.dcard.a { background: linear-gradient(160deg, #3a5dab, #1E2A5A); } .dcard.b { background: linear-gradient(160deg, #c94a7a, #7a2350); }
.dcard .ic { font-size: 20px; } .dcard b { font-size: 14.5px; } .dcard span { font-size: 11px; opacity: .88; }
.dcard strong { margin-top: auto; font-size: 18px; font-weight: 900; } .dcard em { font-style: normal; font-size: 11px; opacity: .88; }
.dcard.on { box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--dk), 0 18px 30px -16px rgba(0,0,0,.6); }
.dcard .win { position: absolute; top: -9px; right: -6px; background: var(--gold); color: #2a2420; font-style: normal; font-size: 10px; font-weight: 900; border-radius: 7px; padding: 2px 7px; transform: rotate(6deg); box-shadow: 0 4px 10px -4px rgba(0,0,0,.4); }
.coins { display: flex; gap: 10px; justify-content: center; margin: 4px 0 14px; }
.coin { width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c4, #f5c84a 55%, #c99a1d); box-shadow: inset 0 -4px 0 rgba(0,0,0,.16), 0 6px 12px -6px rgba(0,0,0,.4); font-weight: 900; font-size: 13px; color: #5a4100; display: grid; place-content: center; line-height: 1.05; transition: transform .6s var(--spring), box-shadow .25s; }
.coin small { font-size: 9.5px; display: block; }
.coin.on { transform: translateY(-6px); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--dk), inset 0 -4px 0 rgba(0,0,0,.16), 0 10px 16px -8px rgba(0,0,0,.5); }
/* 계산서 */
.bill { background: var(--soft2); border: 1px solid var(--line2); border-radius: 16px; padding: 12px 14px; }
.ln { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 3px 0; }
.ln b { text-align: right; } .ln.m b { color: var(--green); }
.ln.t { border-top: 1.5px dashed var(--line); margin-top: 6px; padding-top: 8px; font-size: 15px; font-weight: 900; }
.big { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; margin-top: 10px; }
.big > div { padding: 9px 11px; border-radius: 13px; background: var(--ink); color: #fff; }
.big > div:first-child { background: var(--dk); }
.big span { display: block; font-size: 11px; opacity: .75; } .big b { font-size: 17px; font-weight: 900; letter-spacing: -.02em; }
/* 멤버십 · 소셜 */
.mcard { position: relative; overflow: hidden; margin: 2px auto 14px; width: min(290px, 100%); aspect-ratio: 1.6; border-radius: 18px; background: linear-gradient(135deg, #1E2A5A, #3a5dab 60%, #FFC83D 160%); color: #fff; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 18px 30px -16px rgba(30,42,90,.7); animation: give .7s var(--spring); }
.mcard::after { content: ""; position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,.45) 50%, transparent 58%); transform: translateX(-70%); animation: shine 1.4s .5s var(--ease) both; pointer-events: none; }
@keyframes shine { to { transform: translateX(70%); } }
@keyframes give { from { transform: translateY(-40px) rotate(-10deg) scale(.8); opacity: 0; } }
.mcard .l { font-weight: 900; font-size: 22px; color: var(--gold); font-family: var(--brand); } .mcard .v { font-size: 26px; font-weight: 900; } .mcard small { font-size: 11px; opacity: .85; }
.social { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.social .k { background: #FEE500; color: #191600; } .social .n { background: #03C75A; color: #fff; } .social .g { background: #fff; color: #1b1d26; border: 1px solid var(--line); }
/* 서명 · 입력 */

.sign canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

.sign .x { position: absolute; left: 14px; bottom: 12px; font-style: normal; font-weight: 900; font-size: 18px; color: rgba(28,32,36,.25); pointer-events: none; }
.sign.err { border-color: var(--red); animation: shake .4s; }
.fl { position: relative; display: flex; align-items: baseline; gap: 10px; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 12px 9px; margin-bottom: 8px; transition: border-color .2s, box-shadow .25s; }

/* 영수증 */
.rcpt { position: relative; background: #fff; border: 1px solid var(--line); padding: 16px 16px 22px; border-radius: 16px 16px 0 0; -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from 135deg at top, transparent, #000 1deg 89deg, transparent 90deg) bottom / 16px 8px repeat-x; mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from 135deg at top, transparent, #000 1deg 89deg, transparent 90deg) bottom / 16px 8px repeat-x; animation: printIn .9s var(--ease) both; }
@keyframes printIn { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
.rcpt h3 { margin: 0; text-align: center; font-family: var(--brand); font-size: 18px; } .rcpt .no { text-align: center; font-size: 11px; color: var(--muted); margin-bottom: 10px; }

.rcpt .done { position: absolute; right: 12px; top: 34px; border: 2.5px solid var(--red); color: var(--red); font-weight: 900; font-size: 13px; border-radius: 8px; padding: 2px 9px; transform: rotate(-12deg); animation: stamp .45s .5s cubic-bezier(.3, 1.6, .5, 1) both; }

    if (hold) holdUntil = Date.now() + 2800;
  }
  function startTout(id) {
    var d = D.dealers[id], L = ["“" + d.quote + "”"].concat(d.tout || []);
    toutIdx = 0; holdUntil = 0; sayBubble(L[0]);
    toutTimer = setInterval(function () {
      if (Date.now() < holdUntil || document.hidden || shopping()) return;
      toutIdx = (toutIdx + 1) % L.length; sayBubble(L[toutIdx]);
    }, 4200);
  }
  function popEmote(t) { var e = $("#emote"); e.textContent = t; e.classList.remove("pop"); void e.offsetWidth; e.classList.add("pop"); }
  function tickBubble() {
    requestAnimationFrame(tickBubble);
    var c = CH[cur]; if (!c || !c.dealer || !world) return;
    var p = world.headOnScreen(c.id), b = $("#bubble");
    var mobile = matchMedia("(max-width: 760px)").matches;
    var top = Math.max(mobile ? 150 : 120, p.y);
    b.style.transform = "translate(" + Math.round(Math.min(innerWidth - 150, Math.max(150, p.x))) + "px," + Math.round(top) + "px) translate(-50%, -100%)";
    b.style.opacity = Math.abs(progress() - cur) < .15 && !(mobile && cardOpen && top > innerHeight * .4) ? 1 : 0;
    var env = world.toutEnv(c.id);
    if (env > .5 && !emoteOn) { emoteOn = true; popEmote(D.dealers[c.id].emote || "!"); }
    if (env < .15) emoteOn = false;
  }
  requestAnimationFrame(tickBubble);
  addEventListener("scroll", onScroll, { passive: true });

  /* ---------- 캐릭터에 마우스를 올리면: 반응 멘트 + 커서 라벨 ---------- */
  function onDealerHover(id) {
    cursorDealer(id);
    var c = CH[cur];
    if (id && c && c.id === id && !shopping()) sayBubble(D.dealers[id].hover, true);
  }

  /* ---------- 폰팔이 카드: 아바타 + 셀링포인트 3개 + 가게 들어가기 ---------- */
  function renderCard(id) {
    var d = D.dealers[id], card = $("#card");
    card.style.setProperty("--c", d.color); card.style.setProperty("--dk", d.ink || "#202529"); card.dataset.d = id; card.innerHTML = "";
    var head = el("div", { class: "card-h" });
    head.innerHTML = PPShop.ava(id);
    head.appendChild(el("div", { class: "who" }, [el("span", { class: "badge", text: d.name }), el("small", { class: "role", text: d.role || "" })]));
    head.appendChild(el("span", { class: "live" }, [el("i"), "호객 중"]));
    card.appendChild(head);
    card.appendChild(el("h2", { text: d.title }));
    card.appendChild(el("ul", { class: "points" }, d.points.map(function (p, k) { return el("li", { style: { "--k": k } }, [el("i", { text: String(k + 1) }), el("span", { text: p })]); })));
    var cta = el("button", { class: "primary magnet", onclick: function () { openShop(id); } }, [el("span", { text: d.short + "에게 사러 가기" }), el("i", { class: "arr", "aria-hidden": "true", text: "→" })]);
    card.appendChild(cta);
  }
  function openDealer(id) { openShop(id); }
  var mobileQ = matchMedia("(max-width: 760px)");
  function openShop(id) {
    var i = indexOf(id); cursorDealer(null);
    if (i !== cur) scrollTo({ top: i * stopH(), behavior: "auto" });
    setCard(false); clearTimeout(cardTimer);
    PPShop.open(id);
    if (world) { world.setProgress(i); world.setFrameOffset(mobileQ.matches ? 0 : -.2, mobileQ.matches ? -.17 : 0); world.halfRate = true; }
  }
  PPShop.init({
    toast: toast,
    onTalk: function (on) { if (world) world.talk(on ? PPShop.state().dealer : null); },
    onClose: function () { if (world) { world.talk(null); world.halfRate = false; } cursorDealer(null); cardOpen = false; onScroll(); },
    openStudio: function (G) { openStudio(G); },
  });

  /* ---------- 시트 (이미지 보기) ---------- */
  var sheet = $("#sheet");
  function showSheet(node) { $("#sheetBody").innerHTML = ""; $("#sheetBody").appendChild(node); if (!sheet.open) sheet.showModal(); }
  document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", function () { b.closest("dialog").close(); }); });
  sheet.addEventListener("click", function (e) { if (e.target === sheet) sheet.close(); });

  /* ---------- 폰꾸 작업실 ---------- */
  var S = D.studio, studio = null, sStep = 0, sMax = 0;
  var sState = { device: "ip17", color: "silver", case: "clear", keyring: "none", back: "none" };
  try { var saved = JSON.parse(localStorage.getItem("pp-studio") || "null"); if (saved) Object.assign(sState, saved); } catch (e) {}
  var STEPS = [
    { key: "device", label: "기기", title: "어떤 폰과 함께해?", list: S.devices },
    { key: "case", label: "케이스", title: "취향을 입혀 봐.", list: S.cases },
    { key: "keyring", label: "키링", title: "작은 디테일, 큰 차이.", list: S.keyrings },
    { key: "back", label: "뒷면", title: "마지막 한 끗.", list: S.backs },
    { key: "done", label: "완성", title: "이 조합, 완전 너답다." },
  ];
  function find(list, id) { return list.filter(function (x) { return x.id === id; })[0] || list[0]; }
  function total() { return find(S.cases, sState.case).price + find(S.keyrings, sState.keyring).price + find(S.backs, sState.back).price; }
  var fromShop = null;
  function devFor(md) { var n = md ? md.name : ""; return /Galaxy|폴더/.test(n) ? "s26" : /Pro|Duo/.test(n) ? "ip18p" : "ip17"; }
  function openStudio(G) {
    if (sheet.open) sheet.close();
    fromShop = G && G.deco ? G : null;
    if (fromShop) { sState.device = devFor(G.md); sState.case = G.deco.case; sState.keyring = G.deco.keyring; sState.back = G.deco.back; sStep = 1; sMax = 4; }
    $("#studio").showModal();
    if (world) world.paused = true;
    if (!studio && window.PPStudio && window.THREE) { try { studio = new PPStudio($("#studioCanvas")); } catch (e) { console.warn(e); } }
    if (studio) { studio.active = true; requestAnimationFrame(function () { studio.resize(); }); }
    renderStudio();
  }
  $("#studio").addEventListener("close", function () {
    if (world) world.paused = false; if (studio) studio.active = false;
    if (fromShop) { PPShop.setDeco({ case: sState.case, keyring: sState.keyring, back: sState.back }); fromShop = null; }
  });
  $("#topCta").addEventListener("click", function () { openStudio(null); });
  document.querySelectorAll("[data-view]").forEach(function (b) { b.addEventListener("click", function () { if (studio) studio.view(b.dataset.view); }); });
  function renderStudio() {
    sMax = Math.max(sMax, sStep);
    try { localStorage.setItem("pp-studio", JSON.stringify(sState)); } catch (e) {}
    if (studio) studio.update(sState, S);
    var steps = $("#studioSteps"); steps.innerHTML = "";
    STEPS.forEach(function (s, i) {
      steps.appendChild(el("button", { "aria-current": i === sStep ? "step" : "false", disabled: i > sMax, onclick: function () { sStep = i; renderStudio(); }, text: (i < sStep ? "✓ " : "") + s.label }));
    });
    var st = STEPS[sStep], body = $("#studioBody"); body.innerHTML = "";
    body.appendChild(el("h3", { text: st.title }));
    if (st.list) {
      body.appendChild(el("div", { class: "opts" }, st.list.map(function (o) {
        var on = sState[st.key] === o.id;
        return el("button", { class: "opt" + (on ? " on" : ""), "aria-pressed": on ? "true" : "false", onclick: function () { sState[st.key] = o.id; renderStudio(); } }, [
          o.c ? el("span", { class: "sw", style: { "--c": o.c } }) : null,
          el("b", { text: o.name }),
          sStep > 0 ? el("small", { text: o.price ? won(o.price) : "추가 없음" }) : null,
        ]);
      })));
      if (st.key === "device") body.appendChild(el("div", { class: "swatches" }, S.colors.map(function (c) {
        return el("button", { class: sState.color === c.id ? "on" : "", style: { "--c": c.c }, "aria-label": c.name, "aria-pressed": sState.color === c.id ? "true" : "false", onclick: function () { sState.color = c.id; renderStudio(); } });
      }).concat([el("span", { class: "note", text: find(S.colors, sState.color).name })])));
    } else {
      var rows = [["기기", find(S.devices, sState.device).name + " · " + find(S.colors, sState.color).name], ["케이스", find(S.cases, sState.case).name], ["키링", find(S.keyrings, sState.keyring).name], ["뒷면", find(S.backs, sState.back).name]];
      body.appendChild(el("div", { class: "sum-rows" }, rows.map(function (r) { return el("div", {}, [el("span", { text: r[0] }), el("b", { text: r[1] })]); })));
      body.appendChild(el("div", { class: "btns" }, [
        el("button", { class: "ghost", text: "이미지 보기", onclick: function () {
          if (!studio) return toast("3D 미리보기를 쓸 수 없는 브라우저예요");
          showSheet(el("div", { class: "center" }, [el("h3", { style: { margin: "0 0 10px" }, text: "길게 눌러 저장" }), el("img", { class: "shot-img", src: studio.snapshot(), alt: "내가 꾸민 폰" })]));
        } }),
        el("button", { class: "primary", text: fromShop ? "이 조합으로 계속" : "디자이너에게 사러 가기", onclick: function () {
          var had = !!fromShop; $("#studio").close();
          if (!had) { openShop("designer"); }
        } }),
      ]));
    }
    $("#studioTotal").textContent = won(total());
    $("#studioPrev").disabled = sStep === 0;
    $("#studioNext").textContent = sStep === STEPS.length - 2 ? "완성 보기" : sStep === STEPS.length - 1 ? "처음부터" : "다음";
  }
  $("#studioPrev").addEventListener("click", function () { if (sStep > 0) { sStep--; renderStudio(); } });
  $("#studioNext").addEventListener("click", function () { sStep = sStep === STEPS.length - 1 ? 0 : sStep + 1; renderStudio(); });

  /* ---------- 인터랙션: 커서·눈·기울기·자석·물결·스포트라이트 ---------- */
  var fine = matchMedia("(hover: hover) and (pointer: fine)").matches, still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var root = document.documentElement, cursor = $("#cursor");
  // 아바타 눈동자: 화면 어디에 마우스가 있든 그쪽을 봄
  var eyeRaf = 0, ex = 0, ey = 0;
  addEventListener("pointermove", function (e) {
    ex = e.clientX / innerWidth * 2 - 1; ey = e.clientY / innerHeight * 2 - 1;
    if (!eyeRaf) eyeRaf = requestAnimationFrame(function () { eyeRaf = 0; root.style.setProperty("--ex", ex.toFixed(3)); root.style.setProperty("--ey", ey.toFixed(3)); });
  }, { passive: true });
  // 커서 따라다니는 링 (+ 캐릭터 위에서는 이름표)
  if (fine && !still && cursor) {
    root.classList.add("has-cursor");
    var cx = -100, cy = -100, tx = -100, ty = -100;
    addEventListener("pointermove", function (e) { tx = e.clientX; ty = e.clientY; cursor.classList.add("on"); }, { passive: true });
    document.addEventListener("pointerleave", function () { cursor.classList.remove("on"); });
    document.addEventListener("pointerover", function (e) {
      var t = e.target;
      cursor.classList.toggle("link", !!(t.closest && t.closest("button, a, input, label, [role=button], .pk, canvas")) && !(t.id === "world" && !cursor.classList.contains("dealer")));
      cursor.classList.toggle("text", !!(t.closest && t.closest("input")));
    });
    (function follow() { cx += (tx - cx) * .2; cy += (ty - cy) * .2; cursor.style.transform = "translate(" + cx.toFixed(1) + "px," + cy.toFixed(1) + "px)"; requestAnimationFrame(follow); })();
  }
  function cursorDealer(id) {
    if (!cursor) return;
    cursor.classList.toggle("dealer", !!id);
    if (id) {
      var d = D.dealers[id], here = CH[cur] && CH[cur].id === id;
      cursor.style.setProperty("--c", d.color);
      $("#cursorLabel").textContent = here ? d.short + "에게 사러 가기" : d.short + " 보러 가기";
    }
  }
  if (fine && !still) {
    // 카드 3D 기울기 + 스포트라이트
    var card = $("#card");
    card.addEventListener("pointermove", function (e) {
      var r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      card.style.setProperty("--mx", (x * 100).toFixed(1) + "%"); card.style.setProperty("--my", (y * 100).toFixed(1) + "%");
      card.style.setProperty("--rx", ((.5 - y) * 5).toFixed(2) + "deg"); card.style.setProperty("--ry", ((x - .5) * 6).toFixed(2) + "deg");
    });
    card.addEventListener("pointerleave", function () { card.style.setProperty("--rx", "0deg"); card.style.setProperty("--ry", "0deg"); });
    // 자석 버튼: 마우스 쪽으로 살짝 끌려옴
    var lastMag = null;
    document.addEventListener("pointermove", function (e) {
      var m = e.target.closest && e.target.closest(".magnet, .say.go");
      if (lastMag && lastMag !== m) { lastMag.style.removeProperty("--tx"); lastMag.style.removeProperty("--ty"); }
      lastMag = m; if (!m) return;
      var r = m.getBoundingClientRect();
      m.style.setProperty("--tx", ((e.clientX - r.left - r.width / 2) * .16).toFixed(1) + "px");
      m.style.setProperty("--ty", ((e.clientY - r.top - r.height / 2) * .3).toFixed(1) + "px");
    }, { passive: true });
    // 가게 테이블: 상품 카드 스포트라이트, 할인 카드 기울기
    $("#shopPanel").addEventListener("pointermove", function (e) {
      var t = e.target.closest && e.target.closest(".pk, .dcard, .tok, .veh button, .way"); if (!t) return;
      var r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      t.style.setProperty("--mx", (x * 100).toFixed(1) + "%"); t.style.setProperty("--my", (y * 100).toFixed(1) + "%");
      if (t.classList.contains("dcard")) { t.style.setProperty("--rx", ((.5 - y) * 10).toFixed(1) + "deg"); t.style.setProperty("--ry", ((x - .5) * 12).toFixed(1) + "deg"); }
    });
    $("#shopPanel").addEventListener("pointerout", function (e) {
      var t = e.target.closest && e.target.closest(".dcard"); if (t && !t.contains(e.relatedTarget)) { t.style.setProperty("--rx", "0deg"); t.style.setProperty("--ry", "0deg"); }
    });
  }
  // 누르면 물결
  if (!still) document.addEventListener("pointerdown", function (e) {
    var b = e.target.closest && e.target.closest(".say, .primary, .ghost, .tok, .veh button, .brands button, .social button, .foldseg button, .sbtn, .top-cta, .chapters button, .ctabs button");
    if (!b) return;
    var r = b.getBoundingClientRect(), size = Math.max(r.width, r.height) * 2.2, s = el("span", { class: "rip", "aria-hidden": "true" });
    s.style.cssText = "width:" + size + "px;height:" + size + "px;left:" + (e.clientX - r.left - size / 2) + "px;top:" + (e.clientY - r.top - size / 2) + "px";
    b.appendChild(s); setTimeout(function () { s.remove(); }, 650);
  });

  /* ---------- 시작 ---------- */
  function ready() { document.body.classList.add("ready"); }
  if (world) { var w0 = Date.now(); (function wait() { if (world.frames > 2 || Date.now() - w0 > 6000) ready(); else requestAnimationFrame(wait); })(); }
  else { var im = $("#fallbackImg"); im.onload = ready; setTimeout(ready, 2500); }
  onScroll();
  window.PP = { world: function () { return world; }, go: go, state: function () { return { cur: cur, cardOpen: cardOpen, studio: sState, step: sStep }; } };
})();

</script>
