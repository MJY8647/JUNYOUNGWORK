<title>폰파리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="에펠탑 광장에 폰 시장이 열렸다. 여섯 폰팔이를 만나고, 3D로 내 폰을 꾸며 보세요.">
  <meta name="theme-color" content="#cfd8dc">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
/* 폰파리 — 영상과 같은 밝은 하늘·회색 광장 톤 하나로 고정한 단일 테마 */
:root {
  --ink: #202529;
  --muted: #737d86;
  --line: #dce1e4;
  --soft: #f3f5f6;
  --paper: #ffffff;
  --blue: #254bf1;
  --orange: #ff6a23;
  --red: #e5333f;
  --sky: #cfd8dc;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --brand: "Arial Black", Arial, var(--font);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-snap-type: y mandatory; }
html, body { margin: 0; }
body { word-break: keep-all; background: var(--sky); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }

/* 스크롤 트랙: 장면 하나 = 화면 하나 */
.track { position: relative; z-index: 1; pointer-events: none; }
.stop { height: 100vh; height: 100svh; scroll-snap-align: start; scroll-snap-stop: always; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

#world, #fallback { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; transition: filter .08s linear; }
#fallback img { width: 100%; height: 100%; object-fit: cover; transition: opacity .4s; }

/* 헤더 */
.top {
  position: fixed; z-index: 20; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 14px max(18px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.brand { background: rgba(255,255,255,.78); backdrop-filter: blur(8px); padding: 4px 12px 5px; border-radius: 999px; font-family: var(--brand); font-weight: 900; font-size: 22px; letter-spacing: -.04em; color: var(--ink); text-decoration: none; }
.brand span { color: var(--blue); }
.brand i { font-style: normal; color: var(--orange); margin-left: 2px; }
.top-note { font-size: 13px; color: var(--ink); background: rgba(255,255,255,.6); padding: 4px 10px; border-radius: 999px; }
.top-cta { margin-left: auto; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; box-shadow: 0 6px 18px -8px rgba(0,0,0,.5); }

/* 로더 */
#loader { position: fixed; inset: 0; z-index: 50; background: var(--sky); display: grid; place-content: center; justify-items: center; gap: 10px; transition: opacity .6s var(--ease), visibility .6s; }
#loader b { font-family: var(--brand); font-size: 40px; letter-spacing: -.05em; }
#loader b span { color: var(--blue); }
#loader small { color: var(--muted); }
#loader i { width: 120px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--orange) 40%, transparent 0) 0 0 / 200% 100%; animation: load 1s linear infinite; }
@keyframes load { to { background-position: -200% 0; } }
body.ready #loader { opacity: 0; visibility: hidden; }

/* 장면 제목 */
.headline {
  position: fixed; z-index: 5; left: max(20px, env(safe-area-inset-left, 0px)); top: 92px; max-width: min(560px, 86vw);
  pointer-events: none; transition: opacity .35s var(--ease), transform .5s var(--ease);
  background: rgba(255,255,255,.62); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 16px 20px 18px; border-radius: 22px;
}
.headline.off { opacity: 0; transform: translateY(14px); }
.eyebrow { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--ink); opacity: .65; }
.headline h1 { margin: 0; font-size: clamp(30px, 5.4vw, 64px); line-height: 1.12; font-weight: 900; letter-spacing: -.035em; text-wrap: balance; color: var(--ink); text-shadow: 0 1px 24px rgba(255,255,255,.55); }
.headline .sub { margin: 12px 0 0; font-size: 15px; color: var(--ink); opacity: .75; }
.headline.light h1, .headline.light .eyebrow, .headline.light .sub { color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.35); }

/* 말풍선 */
.bubble {
  position: fixed; z-index: 6; left: 0; top: 0; transform: translate(-50%, -100%); max-width: 260px;
  background: rgba(22, 26, 34, .88); color: #fff; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.4;
  pointer-events: none; transition: opacity .3s; text-align: center; backdrop-filter: blur(6px);
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: rgba(22, 26, 34, .88); }
.bubble b { display: block; color: var(--c, #ffb27d); font-size: 12px; margin-bottom: 2px; }

/* 폰팔이 카드 (영상 속 흰 카드) */
.card {
  position: fixed; z-index: 8; right: max(24px, env(safe-area-inset-right, 0px)); top: 50%; width: 400px; max-height: calc(100vh - 140px);
  background: var(--paper); border-radius: 22px; padding: 20px; box-shadow: 0 24px 60px -24px rgba(10, 20, 30, .45);
  transform: translate(30px, -50%); opacity: 0; visibility: hidden; transition: transform .5s var(--ease), opacity .35s, visibility .35s;
  overflow-y: auto; overscroll-behavior: contain; border-top: 5px solid var(--c, var(--line));
}
.card.on { transform: translate(0, -50%); opacity: 1; visibility: visible; }
.badge { display: inline-block; padding: 5px 12px; border-radius: 999px; background: var(--c); color: #fff; font-weight: 700; font-size: 13px; }
.card h2 { margin: 10px 0 12px; font-size: 21px; line-height: 1.3; letter-spacing: -.03em; font-weight: 900; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.chip { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; font-weight: 500; background: #fff; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.row { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; margin: 0 -4px; padding-left: 4px; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.prod { flex: 0 0 148px; scroll-snap-align: start; border: 1px solid var(--line); border-radius: 16px; padding: 10px; text-align: left; background: #fff; transition: transform .15s var(--ease), border-color .15s; }
.prod:hover { border-color: var(--ink); }
.prod:active { transform: scale(.97); }
.prod .shot { height: 96px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; margin-bottom: 8px; }
.prod b { display: block; font-size: 14px; }
.prod s { display: block; color: var(--muted); font-size: 12px; }
.prod .pr { font-weight: 900; font-size: 14px; white-space: nowrap; }
.prod .pr em { font-style: normal; color: var(--red); margin-right: 5px; }
.prod .tag { color: var(--blue); font-weight: 700; font-size: 13px; }
.prod .more { display: block; margin-top: 4px; color: var(--blue); font-size: 12px; font-weight: 500; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid3 .prod { flex: none; padding: 8px; text-align: center; }
.grid3 .prod .shot { height: 70px; }
.grid3 .prod b { font-size: 12px; }
.grid3 .prod .pr { color: var(--red); font-size: 12px; }

.steps-list { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; }
.steps-list button { width: 100%; display: grid; grid-template-columns: 30px 1fr 16px; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 14px; background: var(--soft); font-weight: 700; font-size: 14px; }
.steps-list .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; font-size: 13px; }
.steps-list .bar { width: 4px; height: 20px; border-radius: 2px; background: var(--c); justify-self: center; }
.steps-list .ar { color: var(--muted); transition: transform .2s; }
.steps-list li.open .ar { transform: rotate(90deg); }
.steps-list p { margin: 0; max-height: 0; overflow: hidden; color: var(--muted); font-size: 13px; padding: 0 12px 0 52px; transition: max-height .3s var(--ease), padding .3s; }
.steps-list li.open p { max-height: 120px; padding: 6px 12px 6px 52px; }

.combo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.combo button, .grades button { border: 2px solid var(--line); border-radius: 14px; padding: 12px 8px; font-weight: 700; font-size: 13px; background: #fff; display: grid; gap: 4px; justify-items: center; }
.combo button .ic { font-size: 22px; }
.combo button.on, .grades button.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, #fff); }
.grades { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.grades button { justify-items: start; text-align: left; padding: 14px; }
.grades .badge { font-size: 12px; padding: 3px 10px; }
.grades small { color: var(--muted); font-weight: 500; }
.note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }

.primary, .ghost { min-height: 50px; padding: 0 20px; border-radius: 14px; font-weight: 700; font-size: 15px; }
.primary { background: var(--ink); color: #fff; width: 100%; }
.card .primary { background: var(--c); margin-top: 12px; position: sticky; bottom: 0; box-shadow: 0 -12px 16px -4px #fff; }
.ghost { background: var(--soft); }
.link { color: var(--blue); font-weight: 700; font-size: 14px; padding: 6px 0; }

/* 폰 아이콘 (CSS로 그린 단말) */
.ph { --c: #ddd; width: 40px; height: 76px; border-radius: 9px; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c)); position: relative; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.08), 0 6px 12px -6px rgba(0,0,0,.35); }
.ph::before { content: ""; position: absolute; left: 5px; top: 5px; width: 16px; height: 16px; border-radius: 5px; background: rgba(0,0,0,.18); box-shadow: inset 4px 4px 0 -1px rgba(20,20,25,.7), inset -4px -4px 0 -1px rgba(20,20,25,.7); }
.ph.folder { height: 64px; width: 38px; border-radius: 6px; }
.ph.folder::before { left: 6px; top: 8px; width: 26px; height: 18px; border-radius: 3px; background: #556; box-shadow: none; }
.ph.big { width: 84px; height: 160px; border-radius: 18px; }
.ph.big::before { left: 10px; top: 10px; width: 34px; height: 34px; border-radius: 10px; }

/* 장면 내비 */
.chapters { position: fixed; z-index: 9; left: max(18px, env(safe-area-inset-left, 0px)); bottom: 26px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100vw - 480px); }
.chapters button { display: flex; align-items: center; gap: 6px; padding: 7px 11px 7px 8px; border-radius: 999px; background: rgba(255,255,255,.72); backdrop-filter: blur(8px); font-size: 12px; font-weight: 700; color: var(--ink); transition: background .2s, color .2s; }
.chapters i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--ink)); }
.chapters button[aria-current="true"] { background: var(--ink); color: #fff; }
.progress { position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.4); }
.progress i { display: block; height: 100%; width: 0; background: var(--orange); }
.scroll-hint { position: fixed; z-index: 9; left: 50%; bottom: 74px; transform: translateX(-50%); background: rgba(255,255,255,.8); padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; transition: opacity .3s; }
.scroll-hint span { display: inline-block; animation: nudge 1.4s var(--ease) infinite; }
@keyframes nudge { 50% { transform: translateY(4px); } }
.scroll-hint.off { opacity: 0; pointer-events: none; }

/* 시트 */
dialog { border: 0; padding: 0; color: var(--ink); background: transparent; }
dialog::backdrop { background: rgba(14, 20, 28, .45); backdrop-filter: blur(3px); }
.sheet { width: min(460px, calc(100% - 24px)); max-height: calc(100vh - 40px); }
.sheet-in { position: relative; background: #fff; border-radius: 24px; padding: 22px; max-height: calc(100vh - 40px); overflow-y: auto; }
.sheet[open] .sheet-in { animation: rise .4s var(--ease); }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.x { position: absolute; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 50%; background: var(--soft); }
.detail { display: grid; justify-items: center; text-align: center; gap: 6px; padding-top: 6px; }
.detail .shot { width: 100%; height: 190px; border-radius: 18px; background: var(--soft); display: grid; place-items: center; margin-bottom: 8px; }
.detail h3 { margin: 0; font-size: 22px; }
.detail s { color: var(--muted); }
.detail .big { font-size: 30px; font-weight: 900; letter-spacing: -.03em; }
.detail .big em { font-style: normal; color: var(--red); font-size: 22px; margin-right: 8px; }
.btns { display: flex; gap: 8px; width: 100%; margin-top: 12px; }
.btns > * { flex: 1; }
.sum-rows { display: grid; gap: 6px; margin: 14px 0; }
.sum-rows div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; background: var(--soft); border-radius: 12px; font-size: 14px; }
.sum-rows span { color: var(--muted); }
.tel { display: block; text-align: center; font-size: 30px; font-weight: 900; letter-spacing: -.02em; color: var(--ink); text-decoration: none; margin: 6px 0 2px; user-select: all; }
.center { text-align: center; }
.pick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.shot-img { width: 100%; border-radius: 16px; background: var(--soft); }

/* 3D 작업실 */
.studio { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; background: #edf2f4; }
.studio[open] { display: block; animation: fade .35s var(--ease); }
@keyframes fade { from { opacity: 0; } }
.studio-grid { display: grid; grid-template-columns: 1fr 440px; height: 100%; }
.stage3d { position: relative; background: radial-gradient(circle at 50% 40%, #ffffff, #dfe7ec 70%); display: flex; flex-direction: column; min-height: 0; }
.stage-top, .stage-bottom { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; gap: 10px; }
.stage-top { padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
.pill { background: var(--c); color: #fff; padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; }
.ed { font-family: var(--brand); font-size: 12px; letter-spacing: .1em; color: var(--muted); }
#studioCanvas { flex: 1; min-height: 0; cursor: grab; }
#studioCanvas:active { cursor: grabbing; }
#studioCanvas canvas { display: block; width: 100%; height: 100%; }
.stage-bottom span { color: var(--muted); font-size: 13px; }
.seg { display: flex; background: #fff; border-radius: 999px; padding: 3px; }
.seg button { padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; }
.seg button:hover { background: var(--soft); }
.panel { background: #fff; display: flex; flex-direction: column; min-height: 0; padding: calc(18px + env(safe-area-inset-top, 0px)) 22px calc(18px + env(safe-area-inset-bottom, 0px)); }
.panel-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--brand); font-size: 12px; letter-spacing: .1em; color: var(--muted); }
.steps { display: flex; gap: 6px; margin: 16px 0; overflow-x: auto; scrollbar-width: none; }
.steps button { padding: 8px 12px; border-radius: 999px; background: var(--soft); font-weight: 700; font-size: 13px; white-space: nowrap; }
.steps button[aria-current="step"] { background: var(--ink); color: #fff; }
.steps button:disabled { opacity: .4; }
.panel-body { flex: 1; overflow-y: auto; min-height: 0; }
.panel-body h3 { margin: 4px 0 14px; font-size: 24px; letter-spacing: -.03em; font-weight: 900; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { border: 2px solid var(--line); border-radius: 16px; padding: 14px; text-align: left; display: grid; gap: 4px; background: #fff; }
.opt.on { border-color: var(--ink); }
.opt .sw { width: 28px; height: 28px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.opt small { color: var(--muted); }
.swatches { display: flex; gap: 10px; margin-top: 14px; align-items: center; padding: 6px; }
.swatches button { width: 34px; height: 34px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.swatches button.on { outline: 3px solid var(--ink); outline-offset: 2px; }
.panel-foot { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.sum { display: flex; justify-content: space-between; align-items: baseline; }
.sum span { color: var(--muted); font-size: 13px; }
.sum b { font-size: 22px; }
.panel-foot .btns { margin: 0; }
.panel-foot .primary { width: auto; }

.toast { position: fixed; z-index: 60; left: 50%; top: 80px; transform: translate(-50%, -10px); opacity: 0; background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; pointer-events: none; transition: opacity .25s, transform .25s var(--ease); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* 모바일: 영상처럼 세로 화면, 카드는 아래에서 올라옴 */
@media (max-width: 760px) {
  .top { padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; }
  .top-note { display: none; }
  .brand { font-size: 19px; }
  .top-cta { padding: 8px 13px; font-size: 13px; }
  .headline { top: 108px; left: 12px; right: 12px; max-width: none; padding: 14px 16px; }
  .headline h1 { font-size: clamp(28px, 8.4vw, 40px); }
  .card { left: 10px; right: 10px; width: auto; top: auto; bottom: 10px; max-height: 56vh; max-height: 56svh; transform: translateY(40px); border-radius: 20px; padding: 16px; }
  .card.on { transform: none; }
  .card h2 { font-size: 18px; margin: 8px 0 10px; }
  .prod { flex-basis: 132px; }
  .chapters { top: calc(56px + env(safe-area-inset-top, 0px)); bottom: auto; left: 0; right: 0; max-width: none; flex-wrap: nowrap; overflow-x: auto; padding: 0 12px; scrollbar-width: none; }
  .chapters::-webkit-scrollbar { display: none; }
  .chapters button { flex: none; }
  .scroll-hint { bottom: 40px; }
  .studio-grid { grid-template-columns: 1fr; grid-template-rows: 46% 54%; }
  .panel { padding-top: 14px; border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px -18px rgba(0,0,0,.3); }
  .stage-bottom { padding: 8px 14px; }
  .stage-bottom span { display: none; }
  .panel-body h3 { font-size: 20px; margin-bottom: 10px; }
  .opt { padding: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
}

/* ===== 폰팔이 가게 (1mm STORE v6 흐름: 미션 → 테이블 → 대사창 → 말풍선) ===== */
html.shopping { overflow: hidden; scroll-snap-type: none; }
html.shopping .card, html.shopping .bubble, html.shopping .headline, html.shopping .chapters, html.shopping .scroll-hint, html.shopping .progress, html.shopping .top-note { display: none !important; }
.shop { position: fixed; inset: 0; z-index: 30; pointer-events: none; --paper: #fffaf0; --pi: #2a2420; --pm: #7b6f62; --navy: #1E2A5A; --gold: #FFC83D; --gold2: #c99a1d; }
.shop > * { pointer-events: auto; }
.shop-top { position: absolute; left: 0; right: 0; top: calc(64px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; align-items: center; padding: 0 max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); }
.sbtn { flex: none; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 4px 12px -6px rgba(0,0,0,.4); font-size: 16px; font-weight: 700; }
.mission { flex: 1; list-style: none; margin: 0; padding: 6px 8px; display: flex; justify-content: space-between; gap: 2px; background: rgba(255,255,255,.92); border-radius: 16px; border: 1.5px solid var(--c); box-shadow: 0 6px 18px -10px rgba(0,0,0,.5); min-width: 0; max-width: 560px; margin-inline: auto; }
.mission li { flex: 1; display: grid; justify-items: center; gap: 1px; opacity: .38; filter: grayscale(1); transition: opacity .3s, transform .3s; min-width: 0; }
.mission li i { font-style: normal; font-size: 15px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.mission li span { font-size: 10.5px; font-weight: 700; white-space: nowrap; }
.mission li.on, .mission li.now { opacity: 1; filter: none; }
.mission li.on i { background: color-mix(in srgb, var(--c) 22%, #fff); }

    var r = c.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); c.width = r.width * dpr; c.height = r.height * dpr;
    var x = c.getContext("2d"); x.scale(dpr, dpr); x.lineWidth = 2.6; x.lineCap = "round"; x.strokeStyle = "#1E2A5A";
    if (G.sig) { var im = new Image(); im.onload = function () { x.drawImage(im, 0, 0, r.width, r.height); }; im.src = G.sig; }
    var last = null, pt = function (e) { var b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    c.onpointerdown = function (e) { c.setPointerCapture(e.pointerId); last = pt(e); };

    c.onpointerup = function () { last = null; if (G.ink > 40) { G.signed = true; G.sig = c.toDataURL(); if (G.err.sign) { delete G.err.sign; c.parentNode.classList.remove("err"); } } };
  }

  function onPanel(e) {
    var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    var a = b.dataset.act, v = b.dataset.v;
    if (a === "brand") { G.brand = v; G.tab = null; }
    if (a === "tab") G.tab = v;
    if (a === "model") { var x = C.mmModelOf(v); G.md = x.m; G.si = 0; G.ci = 0; go("spec"); return; }
    if (a === "ci") G.ci = +v;
    if (a === "sto") G.si = +v;
    if (a === "deco") { G.deco[b.dataset.k] = v; }
    if (a === "studio") { if (opts.openStudio) opts.openStudio(G); return; }
    if (a === "qs") G.quick.speed = v;
    if (a === "qo") G.quick.open = v;
    if (a === "focus") G.focus = v;
    if (a === "safe") G.safe[v] = !G.safe[v];
    if (a === "stamp") G.stamps[v] = !G.stamps[v];
    if (a === "unit") G.usedId = v;
    if (a === "tier") { G.tier = +v; go("calc"); return; }
    if (a === "way") { G.pick = v; G.con = null; }
    if (a === "con") G.con = v;
    if (a === "months") G.months = +v;
    if (a === "join") { G.member = true; toast("🎉 -" + man(C.MEMBER_DC) + " 멤버십 등록!"); go("joined"); return; }
    if (a === "agree") { G.agree[v] = !G.agree[v]; delete G.err[v]; }

  function open(dealer) {
    G = fresh(dealer); HIST = []; CUR = null;
    var d = D.dealers[dealer], sec = $("#shop");
    sec.hidden = false; sec.style.setProperty("--c", d.color); sec.dataset.dealer = dealer;
    $("#shopWho").textContent = d.name;

  }
  function close() {
    timers.forEach(clearTimeout); if (typing) clearInterval(typing); typing = null;
    $("#shop").hidden = true; document.documentElement.classList.remove("shopping");
    if (opts.onClose) opts.onClose();
  }
  function init(o) {
    opts = o || {};
    $("#shopPanel").addEventListener("click", onPanel);
    $("#shopPanel").addEventListener("input", function (e) { var f = e.target.dataset.f; if (f) G.f[f] = e.target.value; });
    $("#shopDlg").addEventListener("click", function () { if (typing) finish(); });
    $("#shopBack").addEventListener("click", back);
    $("#shopExit").addEventListener("click", close);
    addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#shop").hidden && !document.querySelector("dialog[open]")) close(); });
  }
  window.PPShop = {
    init: init, open: open, close: close, go: go, repaint: repaint,
    state: function () { return G; }, step: function () { return CUR; },
    setDeco: function (deco) { if (G) { Object.assign(G.deco, deco); if (CUR === "point") repaint(); } },
    methods: function () { return ways(); }, way: function () { return curWay(); },
  };
})();

  <script>
/* 폰파리 — 스크롤 ↔ 3D 카메라 연결, 폰팔이 카드, 클릭 흐름, 폰꾸 작업실 */
(function () {
  "use strict";
  var D = window.SITE, $ = function (s) { return document.querySelector(s); };
  var won = function (n) { return n.toLocaleString("ko-KR") + "원"; };
  var CH = D.chapters, N = CH.length;

  function el(tag, attrs, kids) {

  var toastT;
  function toast(m) { var t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("on"); }, 1800); }

  /* ---------- 스크롤 트랙 ---------- */
  var track = $("#track");
  CH.forEach(function (c, i) {
    var label = c.dealer ? D.dealers[c.id].name : c.title.replace("\n", " ");
    track.appendChild(el("section", { class: "stop", id: "s-" + c.id }, [el("h2", { class: "sr", text: label })]));
  });
  var nav = $("#chapters");
  CH.forEach(function (c, i) {
    var d = c.dealer ? D.dealers[c.id] : null;
    nav.appendChild(el("button", { style: { "--c": d ? d.color : "#202529" }, "aria-label": (d ? d.name : c.nav) + " 장면으로", onclick: function () { go(i); } },
      [el("i"), d ? d.short : c.nav]));
  });
  function stopH() { return track.firstChild.offsetHeight || innerHeight; }
  function go(i) { scrollTo({ top: i * stopH(), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
  $("#brand").addEventListener("click", function (e) { e.preventDefault(); go(0); });
  $("#scrollHint").addEventListener("click", function () { go(1); });

  /* ---------- 3D 월드 ---------- */
  var world = null;
  if (window.THREE && window.PPWorld && PPWorld.supported()) {
    try { world = new PPWorld($("#world"), D, { onDealer: function (id) { if (document.documentElement.classList.contains("shopping")) return; var i = indexOf(id); if (i !== cur) go(i); else openDealer(id); }, preserve: /[?&]shot/.test(location.search) }); }
    catch (e) { console.warn(e); world = null; }
  }
  if (!world) { $("#world").hidden = true; $("#fallback").hidden = false; }
  function indexOf(id) { for (var i = 0; i < N; i++) if (CH[i].id === id) return i; return 0; }
  addEventListener("resize", function () { if (world) world.resize(); });

  /* ---------- 장면 상태 ---------- */
  var cur = -1, cardOpen = false, cardTimer = 0;
  function progress() { return Math.max(0, Math.min(N - 1, scrollY / stopH())); }
  function onScroll() {
    if (document.documentElement.classList.contains("shopping")) return;
    var s = progress(), i = Math.round(s), near = Math.abs(s - i);
    if (world) world.setProgress(s);
    else { var img = $("#fallbackImg"), src = "assets/fallback/" + FALLBACK[i] + ".webp"; if (img.getAttribute("src") !== src) img.src = src; }
    $("#progress").style.width = (s / (N - 1) * 100) + "%";
    $("#scrollHint").classList.toggle("off", s > .3 || cardOpen);
    var c = CH[i];
    $("#headline").classList.toggle("off", !!c.dealer || near > .22);
    if (i !== cur) setChapter(i);
    var showCard = !!c.dealer && near < .12;
    if (showCard !== cardOpen) {
      clearTimeout(cardTimer);
      if (showCard) cardTimer = setTimeout(function () { setCard(true); }, 380); else setCard(false);
    }
  }
  function setCard(on) {
    if (document.documentElement.classList.contains("shopping")) on = false;
    cardOpen = on; $("#card").classList.toggle("on", on);
    if (world) {
      var mobile = matchMedia("(max-width: 760px)").matches;
      world.setFrameOffset(on && !mobile ? -.17 : 0, on && mobile ? -.2 : 0);
    }
  }
  function setChapter(i) {
    cur = i; var c = CH[i];
    nav.querySelectorAll("button").forEach(function (b, k) { b.setAttribute("aria-current", k === i ? "true" : "false"); });
    var active = nav.children[i]; if (active && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = active.offsetLeft - nav.clientWidth / 2 + active.offsetWidth / 2;
    if (c.dealer) { renderCard(c.id); }
    else {
      $("#title").innerHTML = c.title.split("\n").map(function (t) { var s = el("span", { text: t }); return s.outerHTML; }).join("<br>");
      $("#sub").textContent = c.sub || "";
      $("#eyebrow").textContent = i === 0 ? "PHONEPARIS · 에펠탑 광장" : i === N - 1 ? "PHONEPARIS · 다시, 광장" : "PHONEPARIS";
    }
    $("#bubble").hidden = !c.dealer;
    if (c.dealer) { var d = D.dealers[c.id]; $("#bubbleName").textContent = d.name; $("#bubbleName").style.setProperty("--c", d.color); $("#bubbleText").textContent = "“" + d.quote + "”"; }
  }
  function tickBubble() {
    requestAnimationFrame(tickBubble);
    var c = CH[cur]; if (!c || !c.dealer || !world) return;
    var p = world.headOnScreen(c.id), b = $("#bubble");
    var mobile = matchMedia("(max-width: 760px)").matches;
    var top = Math.max(mobile ? 150 : 120, p.y);
    b.style.transform = "translate(" + Math.round(Math.min(innerWidth - 140, Math.max(140, p.x))) + "px," + Math.round(top) + "px) translate(-50%, -100%)";
    b.style.opacity = Math.abs(progress() - cur) < .15 && !(mobile && cardOpen && top > innerHeight * .4) ? 1 : 0;
  }
  requestAnimationFrame(tickBubble);
  addEventListener("scroll", onScroll, { passive: true });

  /* ---------- 폰팔이 카드: 셀링포인트 3개 + 가게 들어가기 ---------- */
  function renderCard(id) {
    var d = D.dealers[id], card = $("#card");
    card.style.setProperty("--c", d.color); card.innerHTML = "";
    card.appendChild(el("span", { class: "badge", text: d.name }));
    card.appendChild(el("h2", { text: d.title }));
    card.appendChild(el("ul", { class: "points" }, d.points.map(function (p, k) { return el("li", {}, [el("i", { text: String(k + 1) }), p]); })));
    card.appendChild(el("button", { class: "primary", text: d.short + "에게 사러 가기 →", onclick: function () { openShop(id); } }));
  }
  function openDealer(id) { openShop(id); }
  var mobileQ = matchMedia("(max-width: 760px)");
  function openShop(id) {
    var i = indexOf(id);
    if (i !== cur) scrollTo({ top: i * stopH(), behavior: "auto" });
    setCard(false); clearTimeout(cardTimer);
    PPShop.open(id);
    if (world) { world.setProgress(i); world.setFrameOffset(mobileQ.matches ? 0 : -.2, mobileQ.matches ? -.17 : 0); }
  }
  PPShop.init({
    toast: toast,
    onTalk: function (on) { if (world) world.talk(on ? PPShop.state().dealer : null); },
    onClose: function () { if (world) world.talk(null); cardOpen = false; onScroll(); },
    openStudio: function (G) { openStudio(G); },
  });

  /* ---------- 시트 (이미지 보기) ---------- */
  var sheet = $("#sheet");
  function showSheet(node) { $("#sheetBody").innerHTML = ""; $("#sheetBody").appendChild(node); if (!sheet.open) sheet.showModal(); }
  document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", function () { b.closest("dialog").close(); }); });
  sheet.addEventListener("click", function (e) { if (e.target === sheet) sheet.close(); });

  /* ---------- 폰꾸 작업실 ---------- */
  var S = D.studio, studio = null, sStep = 0, sMax = 0;
  var sState = { device: "ip17", color: "silver", case: "clear", keyring: "none", back: "none" };
  try { var saved = JSON.parse(localStorage.getItem("pp-studio") || "null"); if (saved) Object.assign(sState, saved); } catch (e) {}
  var STEPS = [
    { key: "device", label: "기기", title: "어떤 폰과 함께해?", list: S.devices },
    { key: "case", label: "케이스", title: "취향을 입혀 봐.", list: S.cases },
    { key: "keyring", label: "키링", title: "작은 디테일, 큰 차이.", list: S.keyrings },
    { key: "back", label: "뒷면", title: "마지막 한 끗.", list: S.backs },
    { key: "done", label: "완성", title: "이 조합, 완전 너답다." },
  ];
  function find(list, id) { return list.filter(function (x) { return x.id === id; })[0] || list[0]; }
  function total() { return find(S.cases, sState.case).price + find(S.keyrings, sState.keyring).price + find(S.backs, sState.back).price; }
  var fromShop = null;
  function devFor(md) { var n = md ? md.name : ""; return /Galaxy|폴더/.test(n) ? "s26" : /Pro|Duo/.test(n) ? "ip18p" : "ip17"; }
  function openStudio(G) {
    if (sheet.open) sheet.close();
    fromShop = G && G.deco ? G : null;
    if (fromShop) { sState.device = devFor(G.md); sState.case = G.deco.case; sState.keyring = G.deco.keyring; sState.back = G.deco.back; sStep = 1; sMax = 4; }
    $("#studio").showModal();
    if (world) world.paused = true;
    if (!studio && window.PPStudio && window.THREE) { try { studio = new PPStudio($("#studioCanvas")); } catch (e) { console.warn(e); } }
    if (studio) { studio.active = true; requestAnimationFrame(function () { studio.resize(); }); }
    renderStudio();
  }
  $("#studio").addEventListener("close", function () {
    if (world) world.paused = false; if (studio) studio.active = false;
    if (fromShop) { PPShop.setDeco({ case: sState.case, keyring: sState.keyring, back: sState.back }); fromShop = null; }
  });
  $("#topCta").addEventListener("click", function () { openStudio(null); });
  document.querySelectorAll("[data-view]").forEach(function (b) { b.addEventListener("click", function () { if (studio) studio.view(b.dataset.view); }); });
  function renderStudio() {
    sMax = Math.max(sMax, sStep);
    try { localStorage.setItem("pp-studio", JSON.stringify(sState)); } catch (e) {}
    if (studio) studio.update(sState, S);
    var steps = $("#studioSteps"); steps.innerHTML = "";
    STEPS.forEach(function (s, i) {
      steps.appendChild(el("button", { "aria-current": i === sStep ? "step" : "false", disabled: i > sMax, onclick: function () { sStep = i; renderStudio(); }, text: (i < sStep ? "✓ " : "") + s.label }));
    });
    var st = STEPS[sStep], body = $("#studioBody"); body.innerHTML = "";
    body.appendChild(el("h3", { text: st.title }));
    if (st.list) {
      body.appendChild(el("div", { class: "opts" }, st.list.map(function (o) {
        var on = sState[st.key] === o.id;
        return el("button", { class: "opt" + (on ? " on" : ""), "aria-pressed": on ? "true" : "false", onclick: function () { sState[st.key] = o.id; renderStudio(); } }, [
          o.c ? el("span", { class: "sw", style: { "--c": o.c } }) : null,
          el("b", { text: o.name }),
          sStep > 0 ? el("small", { text: o.price ? won(o.price) : "추가 없음" }) : null,
        ]);
      })));
      if (st.key === "device") body.appendChild(el("div", { class: "swatches" }, S.colors.map(function (c) {
        return el("button", { class: sState.color === c.id ? "on" : "", style: { "--c": c.c }, "aria-label": c.name, "aria-pressed": sState.color === c.id ? "true" : "false", onclick: function () { sState.color = c.id; renderStudio(); } });
      }).concat([el("span", { class: "note", text: find(S.colors, sState.color).name })])));
    } else {
      var rows = [["기기", find(S.devices, sState.device).name + " · " + find(S.colors, sState.color).name], ["케이스", find(S.cases, sState.case).name], ["키링", find(S.keyrings, sState.keyring).name], ["뒷면", find(S.backs, sState.back).name]];
      body.appendChild(el("div", { class: "sum-rows" }, rows.map(function (r) { return el("div", {}, [el("span", { text: r[0] }), el("b", { text: r[1] })]); })));
      body.appendChild(el("div", { class: "btns" }, [
        el("button", { class: "ghost", text: "이미지 보기", onclick: function () {
          if (!studio) return toast("3D 미리보기를 쓸 수 없는 브라우저예요");
          showSheet(el("div", { class: "center" }, [el("h3", { style: { margin: "0 0 10px" }, text: "길게 눌러 저장" }), el("img", { class: "shot-img", src: studio.snapshot(), alt: "내가 꾸민 폰" })]));
        } }),
        el("button", { class: "primary", text: fromShop ? "이 조합으로 계속" : "디자이너에게 사러 가기", onclick: function () {
          var had = !!fromShop; $("#studio").close();

        } }),
      ]));
    }
    $("#studioTotal").textContent = won(total());
    $("#studioPrev").disabled = sStep === 0;

  $("#studioNext").addEventListener("click", function () { sStep = sStep === STEPS.length - 1 ? 0 : sStep + 1; renderStudio(); });

  function ready() { document.body.classList.add("ready"); }
  if (world) { var w0 = Date.now(); (function wait() { if (world.frames > 2 || Date.now() - w0 > 6000) ready(); else requestAnimationFrame(wait); })(); }
  else { var im = $("#fallbackImg"); im.onload = ready; setTimeout(ready, 2500); }
  onScroll();
  window.PP = { world: function () { return world; }, go: go, state: function () { return { cur: cur, cardOpen: cardOpen, studio: sState, step: sStep }; } };
})();
