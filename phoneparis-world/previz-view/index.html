<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폰파리 프리비즈</title>
<style>
  :root { --bg: #f4f5f7; --card: #ffffff; --ink: #1c2024; --muted: #6f7880; --line: rgba(28,32,36,.12); --accent: #254bf1; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121417; --card: #1c1f23; --ink: #eceef1; --muted: #9aa3ab; --line: rgba(255,255,255,.12); --accent: #7d97ff; } }
  :root[data-theme="dark"] { --bg: #121417; --card: #1c1f23; --ink: #eceef1; --muted: #9aa3ab; --line: rgba(255,255,255,.12); --accent: #7d97ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; word-break: keep-all; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -.02em; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .player { display: grid; grid-template-columns: minmax(0, 360px) 1fr; gap: 20px; align-items: start; }
  @media (max-width: 720px) { .player { grid-template-columns: 1fr; } }
  .screen { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 9 / 16; }
  .screen video { width: 100%; height: 100%; display: block; object-fit: cover; }
  .now { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; }
  .list { display: grid; gap: 6px; }
  .seg { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
  .seg[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .seg small { color: var(--muted); }
  .seg.pending { opacity: .5; cursor: default; }
  .controls { display: flex; gap: 8px; margin-top: 12px; }
  .controls button { flex: 1; padding: 11px; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); font: inherit; font-weight: 700; cursor: pointer; }
  h2 { font-size: 16px; margin: 32px 0 10px; }
  .frames { width: 100%; border-radius: 12px; display: block; }
</style>
</head>
<body>
<main>
  <h1>폰파리 3D 프리비즈 (9:16)</h1>
  <p class="sub">사이트 3D로 뽑은 영상 기준 화면입니다. 광장 → 하강 → 노점 거리 → 폰팔이 6명 → 마무리. 구간마다 6초, 전체 재생은 구간을 이어서 틀어 줍니다. 아직 렌더링 중인 구간은 흐리게 표시됩니다.</p>
  <div class="player">
    <div>
      <div class="screen"><video id="v" muted playsinline controls preload="auto"></video><span class="now" id="now"></span></div>
      <div class="controls"><button id="all">처음부터 전체 재생</button></div>
    </div>
    <div class="list" id="list"></div>
  </div>
  <h2>폰팔이 장면 프레임</h2>
  <img class="frames" src="frames.jpg" alt="광장, 하강, 노점 거리, 디자이너, 세이프티, 올인원 장면 프레임">
</main>
<script src="ready.js"></script>
<script>
  var SEG = [["00-square-to-dive", "광장 → 하강"], ["01-dive-to-market", "하강 → 노점 거리"], ["02-market-to-designer", "노점 거리 → 디자이너"], ["03-designer-to-quick", "디자이너 → 퀵퀵이"], ["04-quick-to-price", "퀵퀵이 → 자린고비"], ["05-price-to-safe", "자린고비 → 세이프티"], ["06-safe-to-used", "세이프티 → 중고폰"], ["07-used-to-allinone", "중고폰 → 올인원"], ["08-allinone-to-finish", "올인원 → 마무리"]];
  var READY = window.READY || [];
  var v = document.getElementById("v"), list = document.getElementById("list"), now = document.getElementById("now"), cur = 0, chain = false;
  SEG.forEach(function (s, i) {
    var ok = READY.indexOf(s[0]) >= 0, b = document.createElement("button");
    b.className = "seg" + (ok ? "" : " pending"); b.innerHTML = "<span>" + (i + 1) + ". " + s[1] + "</span><small>" + (ok ? "6초" : "렌더링 중") + "</small>";
    if (ok) b.onclick = function () { chain = false; play(i); };
    list.appendChild(b);
  });
  function play(i) {
    cur = i; v.src = "v/" + SEG[i][0] + ".mp4"; now.textContent = (i + 1) + ". " + SEG[i][1];
    list.querySelectorAll(".seg").forEach(function (b, k) { b.setAttribute("aria-current", k === i ? "true" : "false"); });
    v.play().catch(function () {});
  }
  v.addEventListener("ended", function () {
    if (!chain) return;
    for (var j = cur + 1; j < SEG.length; j++) if (READY.indexOf(SEG[j][0]) >= 0) return play(j);
    chain = false;
  });
  document.getElementById("all").onclick = function () { chain = true; play(READY.length ? SEG.findIndex(function (s) { return READY.indexOf(s[0]) >= 0; }) : 0); };
  if (READY.length) play(SEG.findIndex(function (s) { return READY.indexOf(s[0]) >= 0; }));
</script>
</body>
</html>
